<title>Arcane Command Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ============================================================
   LEOOS — instrument panel for THE ARCANE.
   One committed visual world: a facility control console.
   ============================================================ */

:root {
  --void:   #07070a;
  --deck:   #0c0c12;
  --plate:  #13131c;
  --raised: #1a1a25;
  --seam:   #222230;
  --seam-lit: #33334a;

  --ink:    #eceaf5;
  --ash:    #807e96;
  --faint:  #55536b;

  --arcane: #8b5cf6;
  --arcane-lift: #a98bff;
  --arcane-wash: rgba(139, 92, 246, 0.13);

  --vital:  #3ecf8e;
  --flare:  #e8b64c;
  --breach: #e5484d;
  --cyan:   #56c9f0;
  --gold:   #d9a441;

  --r-sm: 3px;
  --r-md: 6px;
  --r-lg: 10px;

  --f-display: 'Chakra Petch', 'Helvetica Neue', sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, sans-serif;
  --f-data: 'IBM Plex Mono', ui-monospace, monospace;

  --rail-w: 234px;
  --dash-w: 340px;
}

html { color-scheme: dark; }

body {
  margin: 0;
  background: var(--void);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

*, *::before, *::after { box-sizing: border-box; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--arcane-lift); outline-offset: 2px; border-radius: var(--r-sm); }

/* ---------- atoms ---------- */

.eyebrow {
  font-family: var(--f-display); font-size: 10px; font-weight: 600;
  letter-spacing: .18em; text-transform: uppercase; color: var(--faint);
}
.mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.muted-note { font-size: 11.5px; color: var(--faint); line-height: 1.55; margin: 0; }
.warn-note { font-size: 11.5px; color: var(--flare); line-height: 1.55; margin: 10px 0 0; }

.is-arcane { color: var(--arcane-lift); }
.is-vital  { color: var(--vital); }
.is-flare  { color: var(--flare); }
.is-breach { color: var(--breach); }
.is-cyan   { color: var(--cyan); }
.is-gold   { color: var(--gold); }
.is-clear  { color: var(--vital); }

.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.is-arcane { background: var(--arcane); box-shadow: 0 0 7px var(--arcane); }
.dot.is-vital  { background: var(--vital);  box-shadow: 0 0 7px var(--vital); }
.dot.is-flare  { background: var(--flare);  box-shadow: 0 0 7px var(--flare); }
.dot.is-breach { background: var(--breach); box-shadow: 0 0 7px var(--breach); }
.dot.is-cyan   { background: var(--cyan);   box-shadow: 0 0 7px var(--cyan); }
.dot.is-gold   { background: var(--gold);   box-shadow: 0 0 7px var(--gold); }

.chip {
  font-family: var(--f-data); font-size: 10px; letter-spacing: .05em;
  padding: 2px 6px; border-radius: var(--r-sm);
  border: 1px solid var(--seam); color: var(--ash); white-space: nowrap;
}
.chip.is-seed, .chip.is-flare { color: var(--flare); border-color: rgba(232,182,76,.38); }
.chip.is-arcane { color: var(--arcane-lift); border-color: rgba(139,92,246,.42); }
.chip.is-breach { color: var(--breach); border-color: rgba(229,72,77,.42); }
.chip.is-ash { color: var(--ash); }

.meter { height: 4px; background: var(--raised); border-radius: 2px; overflow: hidden; }
.meter-fill { height: 100%; border-radius: 2px; transition: width .5s ease; background: var(--arcane); }
.meter-fill.is-vital  { background: var(--vital); }
.meter-fill.is-flare  { background: var(--flare); }
.meter-fill.is-breach { background: var(--breach); }
.meter-fill.is-cyan   { background: var(--cyan); }
.meter-fill.is-gold   { background: var(--gold); }
.meter-fill.is-arcane { background: linear-gradient(90deg, var(--arcane), var(--arcane-lift)); }

.sub-title {
  font-family: var(--f-display); font-size: 11px; font-weight: 600;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ash);
  margin: 18px 0 8px;
}

.back-btn, .icon-btn {
  background: transparent; border: 1px solid var(--seam); border-radius: var(--r-sm);
  color: var(--ash); cursor: pointer; font-family: var(--f-data); font-size: 10px; padding: 4px 8px;
}
.back-btn:hover, .icon-btn:hover { border-color: var(--seam-lit); color: var(--ink); }
.icon-btn { font-size: 12px; line-height: 1; padding: 5px 8px; }

/* ============================================================
   Frame
   ============================================================ */

#os {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--dash-w);
  grid-template-rows: 52px minmax(0, 1fr);
  grid-template-areas: 'brand topbar topbar' 'rail stage dash';
  height: 100dvh;
}

.brand {
  grid-area: brand;
  display: flex; align-items: center; gap: 10px; padding: 0 16px;
  border-right: 1px solid var(--seam); border-bottom: 1px solid var(--seam);
  background: var(--deck);
}
.sigil { width: 22px; height: 22px; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .2em; }
.brand-ver { font-family: var(--f-data); font-size: 9px; color: var(--faint); letter-spacing: .1em; }

.topbar {
  grid-area: topbar;
  display: flex; align-items: center; gap: 20px; padding: 0 18px;
  border-bottom: 1px solid var(--seam); background: var(--deck);
  overflow-x: auto; scrollbar-width: none;
}
.topbar::-webkit-scrollbar { display: none; }
.readout { display: flex; flex-direction: column; gap: 1px; flex: none; }
.readout-label { font-family: var(--f-display); font-size: 9px; letter-spacing: .15em; color: var(--faint); text-transform: uppercase; }
.readout-value { font-size: 14px; letter-spacing: -.01em; }
.topbar-spacer { flex: 1 1 auto; min-width: 12px; }

.transport { display: flex; border: 1px solid var(--seam); border-radius: var(--r-md); overflow: hidden; flex: none; }
.transport button {
  background: transparent; border: 0; border-right: 1px solid var(--seam);
  cursor: pointer; font-family: var(--f-data); font-size: 11px; padding: 5px 10px; color: var(--ash);
}
.transport button:last-child { border-right: 0; }
.transport button:hover { background: var(--raised); color: var(--ink); }
.transport button[aria-pressed='true'] { background: var(--arcane-wash); color: var(--arcane-lift); }

/* ---------- left navigation ---------- */

.rail {
  grid-area: rail; border-right: 1px solid var(--seam); background: var(--deck);
  overflow-y: auto; padding-block: 12px;
}
.rail-head { padding: 0 16px 8px; }
.rail-block { padding: 14px 16px 0; margin-top: 12px; border-top: 1px solid var(--seam); }
.rail-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }

.nav-btn {
  display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: center;
  width: 100%; background: transparent; border: 0;
  border-left: 2px solid transparent; padding: 7px 16px; text-align: left; cursor: pointer;
}
.nav-btn:hover { background: var(--plate); }
.nav-btn[aria-current='true'] { background: var(--plate); border-left-color: var(--arcane); }
.nav-btn[aria-current='true'] .nav-name { color: var(--arcane-lift); }
.nav-no { font-size: 10px; color: var(--faint); }
.nav-name { font-family: var(--f-display); font-size: 12px; font-weight: 600; letter-spacing: .1em; line-height: 1.25; }
.nav-sub { font-size: 10.5px; color: var(--faint); line-height: 1.3; }

.commander {
  display: grid; grid-template-columns: 16px 1fr; gap: 9px; align-items: center;
  width: 100%; margin-top: 7px; padding: 8px 9px; text-align: left; cursor: pointer;
  background: var(--arcane-wash); border: 1px solid rgba(139,92,246,.4); border-radius: var(--r-md);
}
.commander:hover { background: rgba(139,92,246,.2); }
.commander-mark { color: var(--arcane-lift); font-size: 13px; }
.commander-name { font-family: var(--f-display); font-size: 12px; font-weight: 600; letter-spacing: .14em; color: var(--arcane-lift); }
.commander-where { font-size: 10px; color: var(--ash); }

/* ---------- stage ---------- */

.stage {
  grid-area: stage; position: relative; background: var(--void);
  display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0;
}
.stage-body { position: relative; min-height: 0; }
.stage-canvas { position: absolute; inset: 0; }
#hull { display: block; width: 100%; height: 100%; }

.stage-tag { position: absolute; top: 12px; left: 16px; display: flex; flex-direction: column; gap: 2px; pointer-events: none; }
.stage-tag-name { font-family: var(--f-display); font-size: 12px; letter-spacing: .24em; color: var(--ash); }

.stage-screen {
  position: absolute; inset: 0; overflow-y: auto;
  padding: 18px 22px 28px; background: var(--void);
}
.stage-screen[hidden], .stage-canvas[hidden] { display: none; }

.screen-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.screen-title { font-family: var(--f-display); font-size: 18px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin: 0; }

.tooltip {
  position: absolute; pointer-events: none; z-index: 6;
  background: var(--plate); border: 1px solid var(--seam-lit); border-radius: var(--r-md);
  padding: 7px 10px; font-size: 11px; line-height: 1.4; max-width: 230px;
  box-shadow: 0 8px 24px rgba(0,0,0,.6); transform: translate(-50%, -125%);
}
.tooltip[hidden] { display: none; }
.tooltip-title { font-family: var(--f-display); font-size: 11px; letter-spacing: .1em; }
.tooltip-body { color: var(--ash); }

.ticker {
  border-top: 1px solid var(--seam); background: var(--deck); height: 42px;
  display: flex; align-items: center; gap: 12px; padding: 0 18px; overflow: hidden;
}
.ticker-label { flex: none; }
.ticker-line { font-family: var(--f-data); font-size: 11px; color: var(--ash); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ticker-time { color: var(--faint); }

/* ---------- room dashboard overlay ---------- */

.room-overlay {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: min(420px, 94%);
  background: rgba(10, 10, 16, 0.97);
  border-left: 1px solid var(--seam-lit);
  box-shadow: -18px 0 40px rgba(0,0,0,.55);
  overflow-y: auto; padding: 16px 18px 26px; z-index: 5;
  animation: slideIn .18s ease-out;
}
.room-overlay[hidden] { display: none; }
@keyframes slideIn { from { transform: translateX(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .room-overlay { animation: none; } }

.room-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  padding-left: 11px; border-left: 3px solid var(--arcane); }
.room-head.is-vital  { border-left-color: var(--vital); }
.room-head.is-flare  { border-left-color: var(--flare); }
.room-head.is-breach { border-left-color: var(--breach); }
.room-head.is-cyan   { border-left-color: var(--cyan); }
.room-head.is-gold   { border-left-color: var(--gold); }
.room-title { font-family: var(--f-display); font-size: 19px; font-weight: 700; letter-spacing: .12em; margin: 2px 0 1px; }
.room-sub { font-size: 11.5px; color: var(--ash); margin: 0; }
.room-blurb { font-size: 12.5px; line-height: 1.6; color: var(--ash); margin: 14px 0 0; }

.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 1px;
  background: var(--seam); border: 1px solid var(--seam); border-radius: var(--r-md); overflow: hidden; margin-top: 14px; }
.stat { background: var(--deck); padding: 10px 11px; display: flex; flex-direction: column; gap: 2px; }
.stat-n { font-family: var(--f-data); font-size: 17px; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat-l { font-size: 10px; color: var(--faint); line-height: 1.3; }

.crew-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.crew-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--plate); border: 1px solid var(--seam); border-radius: var(--r-sm);
  color: var(--ash); cursor: pointer; padding: 5px 9px;
  font-family: var(--f-display); font-size: 11px; letter-spacing: .08em;
}
.crew-chip:hover { border-color: var(--seam-lit); color: var(--ink); }
.crew-chip.is-here { color: var(--ink); border-color: var(--seam-lit); background: var(--raised); }

/* ---------- goals ---------- */

.goal { padding: 10px 0; border-bottom: 1px solid var(--seam); }
.goal:last-child { border-bottom: 0; }
.goal-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 7px; }
.goal-name { font-size: 12.5px; line-height: 1.4; }
.goal-val { font-size: 12px; white-space: nowrap; }
.goal-target { color: var(--faint); }
.goal-foot { display: flex; align-items: center; gap: 7px; margin-top: 7px; }
.goal-pct { margin-left: auto; font-size: 11px; color: var(--ash); }
.goal-input {
  width: 74px; background: var(--void); border: 1px solid var(--seam);
  border-radius: var(--r-sm); padding: 3px 6px; font-size: 11px;
}
.goal-input:focus { border-color: var(--arcane); outline: none; }

/* ---------- orders ---------- */

.orders { display: flex; flex-direction: column; gap: 1px; }
.order {
  display: grid; grid-template-columns: auto 1fr auto; gap: 9px; align-items: start;
  padding: 7px 8px; margin: 0 -8px; border-radius: var(--r-sm); cursor: pointer;
  background: transparent; border: 0; text-align: left; width: calc(100% + 16px);
}
.order:hover { background: var(--plate); }
.order-box {
  width: 13px; height: 13px; margin-top: 2px; flex: none;
  border: 1px solid var(--seam-lit); border-radius: 2px; display: grid; place-items: center;
}
.order.is-done .order-box { background: var(--arcane); border-color: var(--arcane); }
.order-tick { width: 8px; height: 8px; display: none; }
.order.is-done .order-tick { display: block; }
.order-text { font-size: 12.5px; line-height: 1.45; }
.order-pre { color: var(--faint); font-size: 10px; }
.order.is-done .order-text { color: var(--faint); text-decoration: line-through; }
.order-pri { font-family: var(--f-data); font-size: 9px; padding: 1px 5px; border-radius: 2px; margin-top: 2px; flex: none; }
.order-pri.p1 { color: var(--breach); background: rgba(229,72,77,.1); }
.order-pri.p2 { color: var(--flare); background: rgba(232,182,76,.1); }
.order-pri.p3 { color: var(--faint); background: var(--raised); }
.order.is-done .order-pri { opacity: .35; }

.order-add { display: flex; gap: 6px; margin-top: 10px; }
.order-add input {
  flex: 1 1 auto; min-width: 0; background: var(--void); border: 1px solid var(--seam);
  border-radius: var(--r-sm); padding: 6px 8px; font-size: 12px;
}
.order-add input::placeholder { color: var(--faint); }
.order-add input:focus { border-color: var(--arcane); outline: none; }
.order-add button {
  background: var(--raised); border: 1px solid var(--seam); border-radius: var(--r-sm);
  color: var(--ink); cursor: pointer; padding: 0 11px;
  font-family: var(--f-display); font-size: 11px; letter-spacing: .1em;
}
.order-add button:hover { background: var(--arcane-wash); border-color: var(--arcane); color: var(--arcane-lift); }

/* ---------- screens ---------- */

.block { border: 1px solid var(--seam); border-radius: var(--r-md); background: var(--deck); padding: 14px 15px; margin-bottom: 12px; }
.block-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
.block-title {
  display: inline-flex; align-items: center; gap: 8px;
  background: transparent; border: 0; cursor: pointer; padding: 0; color: var(--ink);
  font-family: var(--f-display); font-size: 13px; font-weight: 600; letter-spacing: .11em;
}
.block-title:hover { color: var(--arcane-lift); }

.fact-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.fact {
  font-size: 10.5px; color: var(--ash); background: var(--plate);
  border: 1px solid var(--seam); border-radius: var(--r-sm); padding: 3px 7px;
}

.field-row { display: flex; gap: 10px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 140px; }
.field-l { font-size: 10px; color: var(--faint); font-family: var(--f-display); letter-spacing: .12em; text-transform: uppercase; }
.field-i {
  background: var(--void); border: 1px solid var(--seam); border-radius: var(--r-sm);
  padding: 6px 8px; font-size: 12.5px; width: 100%;
}
.field-i:focus { border-color: var(--arcane); outline: none; }

.cost-row { display: grid; grid-template-columns: 1fr 110px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--seam); }
.cost-row:last-child { border-bottom: 0; }
.cost-name {
  display: inline-flex; align-items: center; gap: 8px; background: transparent; border: 0;
  padding: 0; cursor: pointer; color: var(--ink); font-size: 12.5px; text-align: left;
}
.cost-name:hover { color: var(--arcane-lift); }

.alloc { padding: 10px 0; border-bottom: 1px solid var(--seam); }
.alloc:last-child { border-bottom: 0; }
.alloc-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
.alloc-name { font-size: 12.5px; }
.alloc-amt { font-size: 13px; }
.alloc-foot { display: flex; align-items: center; gap: 10px; margin-top: 7px; }
.alloc-foot .muted-note { flex: 1 1 auto; }
.pct-input {
  width: 52px; background: var(--void); border: 1px solid var(--seam);
  border-radius: var(--r-sm); padding: 3px 6px; font-size: 11px; text-align: right;
}
.pct-input:focus { border-color: var(--arcane); outline: none; }

.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 10px; }
.agent-card {
  display: flex; flex-direction: column; gap: 3px; text-align: left; cursor: pointer;
  background: var(--deck); border: 1px solid var(--seam); border-radius: var(--r-md); padding: 12px 13px;
}
.agent-card:hover { border-color: var(--seam-lit); background: var(--plate); }
.agent-card.is-commander { border-color: rgba(139,92,246,.45); background: var(--arcane-wash); }
.agent-swatch { width: 100%; height: 3px; border-radius: 2px; margin-bottom: 6px; }
.agent-name { font-family: var(--f-display); font-size: 13px; font-weight: 600; letter-spacing: .11em; }
.agent-role { font-size: 11px; color: var(--ash); }
.agent-where { font-size: 10px; color: var(--faint); }
.agent-brief { font-size: 11px; color: var(--faint); line-height: 1.45; margin-top: 5px; }

/* ---------- right telemetry ---------- */

.dash { grid-area: dash; border-left: 1px solid var(--seam); background: var(--deck); overflow-y: auto; }
.panel { border-bottom: 1px solid var(--seam); padding: 14px 16px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.panel-title { font-family: var(--f-display); font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; margin: 0; }

.floor-row {
  display: grid; grid-template-columns: 6px 1fr auto; gap: 10px; align-items: center;
  width: calc(100% + 16px); margin: 0 -8px; padding: 7px 8px;
  background: transparent; border: 0; border-radius: var(--r-sm); text-align: left; cursor: pointer;
}
.floor-row:hover { background: var(--plate); }
.floor-name { font-family: var(--f-display); font-size: 11.5px; letter-spacing: .09em; }
.floor-sub { font-size: 10px; color: var(--faint); }

.mini-alloc { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--seam); }
.mini-alloc:last-of-type { border-bottom: 0; }
.mini-name { font-size: 11.5px; color: var(--ash); }
.mini-amt { font-size: 12px; }

.counsel-log { display: flex; flex-direction: column; gap: 10px; max-height: 230px; overflow-y: auto; margin-bottom: 10px; }
.counsel-turn { font-size: 12px; line-height: 1.55; margin: 0; }
.counsel-turn.is-leo { color: var(--arcane-lift); font-family: var(--f-data); font-size: 11px; }
.counsel-turn.is-ship { white-space: pre-wrap; }
.counsel-form { display: flex; gap: 6px; }
.counsel-form input {
  flex: 1 1 auto; min-width: 0; background: var(--void); border: 1px solid var(--seam);
  border-radius: var(--r-sm); padding: 7px 9px; font-size: 12px;
}
.counsel-form input:focus { border-color: var(--arcane); outline: none; }
.counsel-form button {
  background: var(--arcane-wash); border: 1px solid var(--arcane); border-radius: var(--r-sm);
  color: var(--arcane-lift); cursor: pointer; padding: 0 12px;
  font-family: var(--f-display); font-size: 11px; letter-spacing: .12em;
}
.counsel-form button:disabled { opacity: .4; cursor: default; }

/* ---------- signal cards ---------- */

.signal-card { border: 1px solid var(--seam); border-radius: var(--r-md); background: var(--deck); padding: 12px 13px; margin-bottom: 10px; }
.signal-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.signal-card-src { font-family: var(--f-data); font-size: 10px; color: var(--faint); }
.signal-card-hook { margin: 0 0 8px; font-size: 13.5px; font-weight: 600; line-height: 1.42; text-wrap: balance; }
.signal-card-body {

/* ==== src/core/store.js ==== */
/**
 * Persistence for LEOOS.
 *
 * Prefers the artifact `db` capability so the ship's state follows Leo
 * across devices. Falls back to localStorage when db is unavailable, and
 * to memory when even that is blocked (private windows, cleared storage).
 * The rest of the app never knows which one it got.
 */


const LS_KEY = 'leoos.v1';

const uid = () => Math.random().toString(36).slice(2, 10);

function seedState() {
  const decks = {};
  for (const d of DECKS) {
    decks[d.id] = (SEED_TASKS[d.id] || []).map((s) => ({
      id: uid(), t: s.t, p: s.p, done: false, ts: 0,
    }));
  }
  const ledger = {};
  for (const v of VENTURES) ledger[v.id] = { mrr: 0, units: 0, calibrated: false };
  const goals = {};
  for (const g of GOALS) goals[g.id] = { progress: 0 };
  const budget = { cash: 0, fixed: {}, split: {} };
  for (const f of BUDGET.fixed) budget.fixed[f.id] = f.amount;
  for (const sp of BUDGET.split) budget.split[sp.id] = sp.pct;
  return { decks, ledger, goals, budget, log: [], posts: SEED_POSTS.slice() };
}

class Store {
  constructor() {
    this.state = seedState();
    this.listeners = new Set();
    this.db = null;
    this.mode = 'memory';
    this.writeTimer = null;
  }

  /** Subscribe to any state change. Returns an unsubscribe function. */
  onChange(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  }

  emit() {
    for (const fn of this.listeners) fn(this.state);
  }

  /** Boot: try db, then localStorage. Never throws; never blocks first paint. */
  async connect() {
    try {
      const local = localStorage.getItem(LS_KEY);
      if (local) {
        this.merge(JSON.parse(local));
        this.mode = 'local';
        this.emit();
      }
    } catch { /* storage blocked — memory only */ }

    let db = null;
    try {
      db = await window.claude?.use?.('db');
    } catch { db = null; }
    if (!db) return this.mode;

    this.db = db;
    try {
      const snap = await db.doc('system/ship').get();
      if (snap.exists) this.merge(snap.data());
      this.mode = 'synced';
      this.emit();
      db.doc('system/ship').onSnapshot(
        (s) => {
          if (!s.exists || s.metadata.hasPendingWrites) return;
          this.merge(s.data());
          this.emit();
        },
        () => { this.db = null; this.mode = 'local'; this.emit(); },
      );
    } catch {
      this.db = null;
      this.mode = 'local';
    }
    return this.mode;
  }

  /** Fold a stored body into live state without losing newly-added decks. */
  merge(body) {
    if (!body || typeof body !== 'object') return;
    if (body.decks && typeof body.decks === 'object') {
      for (const d of DECKS) {
        if (Array.isArray(body.decks[d.id])) this.state.decks[d.id] = body.decks[d.id];
      }
    }
    if (body.ledger && typeof body.ledger === 'object') {
      for (const v of VENTURES) {
        if (body.ledger[v.id]) this.state.ledger[v.id] = body.ledger[v.id];
      }
    }
    if (Array.isArray(body.log)) this.state.log = body.log.slice(0, 50);
    if (Array.isArray(body.posts)) this.state.posts = body.posts.slice(0, 60);
    if (body.goals && typeof body.goals === 'object') {
      for (const g of GOALS) if (body.goals[g.id]) this.state.goals[g.id] = body.goals[g.id];
    }
    if (body.budget && typeof body.budget === 'object') {
      const b = body.budget;
      if (Number.isFinite(b.cash)) this.state.budget.cash = b.cash;
      for (const f of BUDGET.fixed) {
        if (Number.isFinite(b.fixed?.[f.id])) this.state.budget.fixed[f.id] = b.fixed[f.id];
      }
      for (const sp of BUDGET.split) {
        if (Number.isFinite(b.split?.[sp.id])) this.state.budget.split[sp.id] = b.split[sp.id];
      }
    }
  }

  /** Persist — debounced, so a burst of ticks becomes one write. */
  save() {
    this.emit();
    clearTimeout(this.writeTimer);
    this.writeTimer = setTimeout(() => this.flush(), 450);
  }

  async flush() {
    const body = {
      decks: this.state.decks,
      ledger: this.state.ledger,
      log: this.state.log.slice(0, 50),
      posts: this.state.posts.slice(0, 60),
      goals: this.state.goals,
      budget: this.state.budget,
    };
    try { localStorage.setItem(LS_KEY, JSON.stringify(body)); } catch { /* ignore */ }
    if (!this.db) return;
    try {
      await this.db.doc('system/ship').set(body);
    } catch (e) {
      if (e && (e.code === 'revoked' || e.code === 'not_granted')) {
        this.db = null;
        this.mode = 'local';
        this.emit();
      }
    }
  }

  /* ---------- orders ---------- */

  tasks(deckId) { return this.state.decks[deckId] || []; }

  openCount(deckId) { return this.tasks(deckId).filter((t) => !t.done).length; }

  totalOpen() { return DECKS.reduce((n, d) => n + this.openCount(d.id), 0); }

  addTask(deckId, text, p = 2) {
    const clean = String(text).trim().slice(0, 180);
    if (!clean) return null;
    const task = { id: uid(), t: clean, p, done: false, ts: Date.now() };
    this.state.decks[deckId] = [task, ...this.tasks(deckId)];
    this.log(`Order logged — ${deckName(deckId)}: ${clean}`);
    this.save();
    return task;
  }

  toggleTask(deckId, taskId) {
    const list = this.tasks(deckId);
    const task = list.find((t) => t.id === taskId);
    if (!task) return;
    task.done = !task.done;
    task.ts = Date.now();
    this.log(task.done
      ? `Order complete — ${deckName(deckId)}: ${task.t}`
      : `Order reopened — ${deckName(deckId)}: ${task.t}`);
    this.save();
  }

  /* ---------- money ---------- */

  monthlyRevenue() {
    return VENTURES.reduce((n, v) => n + (Number(this.state.ledger[v.id]?.mrr) || 0), 0);
  }

  monthlyFixed() {
    return BUDGET.fixed.reduce((n, f) => n + (Number(this.state.budget.fixed[f.id]) || 0), 0);
  }

  /** What survives the month before anything is allocated. */
  monthlyNet() { return this.monthlyRevenue() - this.monthlyFixed(); }

  /** Months of cover at the current burn. Infinite burn-free is reported as null. */
  runwayMonths() {
    const burn = this.monthlyFixed();
    if (burn <= 0) return null;
    return (Number(this.state.budget.cash) || 0) / burn;
  }

  /** Net profit split into its envelopes. */
  allocations() {
    const net = Math.max(0, this.monthlyNet());
    return BUDGET.split.map((sp) => ({
      ...sp,
      pct: Number(this.state.budget.split[sp.id]) || 0,
      amount: net * ((Number(this.state.budget.split[sp.id]) || 0) / 100),
    }));
  }

  splitTotal() {
    return BUDGET.split.reduce((n, sp) => n + (Number(this.state.budget.split[sp.id]) || 0), 0);
  }

  setBudget(field, id, value) {
    const n = Number.isFinite(value) ? value : 0;
    if (field === 'cash') this.state.budget.cash = n;
    else this.state.budget[field][id] = n;
    this.save();
  }

  setLedger(ventureId, field, value) {
    const row = this.state.ledger[ventureId] || (this.state.ledger[ventureId] = {});
    row[field] = value;
    row.calibrated = true;
    this.save();
  }

  ledgerCalibrated() {
    return VENTURES.some((v) => this.state.ledger[v.id]?.calibrated);
  }

  /* ---------- goals ---------- */

  /** A goal's live value: auto-derived where it can be, stored otherwise. */
  goalValue(goal) {
    if (goal.auto === 'mrr') return this.monthlyRevenue();
    if (goal.auto === 'runway') return this.runwayMonths() ?? 0;
    return Number(this.state.goals[goal.id]?.progress) || 0;
  }

  goalPct(goal) {
    if (!goal.target) return 0;
    return Math.max(0, Math.min(1, this.goalValue(goal) / goal.target));
  }

  setGoal(id, progress) {
    this.state.goals[id] = { progress: Number.isFinite(progress) ? progress : 0 };
    this.save();
  }

  /* ---------- signal queue ---------- */

  /** Drafts the Signal Forge has written, newest first. */
  drafts() {
    return (this.state.posts || []).filter((p) => p.status !== 'killed');
  }

  postCount() { return this.drafts().length; }

  markPost(id, status) {
    const post = (this.state.posts || []).find((p) => p.id === id);
    if (!post) return;
    post.status = status;
    this.log(status === 'posted'
      ? `Signal sent — ${post.platform}: ${post.hook}`
      : `Signal killed — ${post.hook}`);
    this.save();
  }

  /* ---------- log ---------- */

  log(text) {
    this.state.log = [{ ts: Date.now(), text }, ...this.state.log].slice(0, 50);
  }

  /** A log line from the simulation — kept in memory, never written. */
  trace(text) {
    this.state.log = [{ ts: Date.now(), text, trace: true }, ...this.state.log].slice(0, 50);
    this.emit();
  }
}

function deckName(id) {
  return DECKS.find((d) => d.id === id)?.name || id.toUpperCase();
}

/* ==== src/core/sim.js ==== */
/**
 * Crew simulation.
 *
 * ARCANE is the one you drive: select a room and the commander walks
 * there. The nine crew work their own stations but drift toward whatever
 * room is carrying the most open orders — and toward ARCANE, because the
 * room the commander is standing in is the room that gets attention.
 */



const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

/** Somewhere inside a room, clear of the walls and the door. */
function interiorPoint(room) {
  const [x1, y1, x2, y2] = room.rect;
  return { x: rand(x1 + 8, x2 - 8), y: rand(y1 + 14, y2 - 6) };
}

/** Walk one room to another along the spine. */
function route(fromId, toId) {
  const a = ROOM_BY_ID[fromId];
  const b = ROOM_BY_ID[toId];
  const pts = [{ x: a.door[0], y: a.door[1] }];
  if (a.door[0] !== SPINE_X) pts.push({ x: SPINE_X, y: a.door[1] });

  const step = a.spine <= b.spine ? 1 : -1;
  for (let i = a.spine; i !== b.spine + step; i += step) {
    pts.push({ x: SPINE_X, y: SPINE[i] });
  }
  if (b.door[0] !== SPINE_X) pts.push({ x: SPINE_X, y: b.door[1] });
  pts.push({ x: b.door[0], y: b.door[1] });
  pts.push(interiorPoint(b));

  return pts.filter((p, i) => i === 0 || Math.hypot(p.x - pts[i - 1].x, p.y - pts[i - 1].y) > 0.5);
}

function makeWalker(def, kind, speed) {
  const room = ROOM_BY_ID[def.home];
  const p = interiorPoint(room);
  return {
    ...def,
    kind,
    speed,
    deck: def.home,
    x: p.x, y: p.y,
    tx: p.x, ty: p.y,
    state: 'work',
    hx: 0, hy: 1,          // heading, for which way the sprite faces
    step: 0,               // walk-cycle phase
    timer: rand(3, 14),
    path: null,
    leg: 0,
    wake: [],
    wakeClock: 0,
    order: null,
  };
}

class Sim {
  constructor(store) {
    this.store = store;
    this.speed = 1;
    this.selectedAgent = null;
    this.agents = CREW.map((c, i) => {
      const a = makeWalker(c, 'crew', 30);
      a.timer += i * 0.6;
      return a;
    });
    this.arcane = makeWalker(ARCANE, 'arcane', 40);
  }

  everyone() { return [...this.agents, this.arcane]; }

  inRoom(id) {
    return this.agents.filter((a) => a.deck === id && a.state === 'work');
  }

  /** 0–1, drives how brightly a room is lit. */
  activity(id) {
    const crew = this.inRoom(id).length;
    const open = this.store.openCount(id);
    const boss = this.arcane.deck === id && this.arcane.state === 'work' ? 0.3 : 0;
    return Math.min(1, crew * 0.26 + Math.min(open, 4) * 0.1 + boss);
  }

  /** Send anyone to a room. This is the command primitive. */
  dispatch(agent, roomId) {
    if (!agent || !ROOM_BY_ID[roomId] || agent.deck === roomId) return false;
    agent.path = route(agent.deck, roomId);
    agent.leg = 0;
    agent.state = 'transit';
    agent.deck = roomId;
    agent.order = null;
    return true;
  }

  /** ARCANE walks to the room you opened. */
  commandTo(roomId) {
    if (this.arcane.deck === roomId && this.arcane.state === 'work') return;
    if (this.dispatch(this.arcane, roomId)) {
      this.store.trace(`ARCANE → ${ROOM_BY_ID[roomId].name}`);
    }
  }

  /** Where a crew member drifts next: open orders pull, so does the commander. */
  chooseTarget(agent) {
    const bag = [];
    for (const r of ROOMS) {
      let w = 1 + this.store.openCount(r.id) * 2.4;
      if (r.id === agent.home) w += 5;
      if (r.id === this.arcane.deck) w += 4;
      if (r.id === agent.deck) w *= 0.2;
      for (let i = 0; i < Math.round(w); i++) bag.push(r.id);
    }
    return bag.length ? pick(bag) : agent.home;
  }

  tick(dt) {
    const step = dt * this.speed;
    for (const a of this.everyone()) {
      a.wakeClock += step;
      if (a.wakeClock > 0.05) {
        a.wakeClock = 0;
        a.wake.push({ x: a.x, y: a.y });
        if (a.wake.length > 14) a.wake.shift();
      }
      if (a.state === 'work') this.tickWork(a, step);
      else this.tickTransit(a, step);
    }
  }

  tickWork(agent, step) {
    const dx = agent.tx - agent.x;
    const dy = agent.ty - agent.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 1.2) {
      const p = interiorPoint(ROOM_BY_ID[agent.deck]);
      agent.tx = p.x; agent.ty = p.y;
      agent.state = 'work';
    } else {
      const v = agent.speed * 0.28 * step;
      agent.x += (dx / dist) * v;
      agent.y += (dy / dist) * v;
      agent.hx = dx / dist;
      agent.hy = dy / dist;
      agent.step += v * 0.42;
    }

    const open = this.store.tasks(agent.deck).find((t) => !t.done);
    agent.order = open ? open.t : null;

    // ARCANE holds position until you send them somewhere
    if (agent.kind === 'arcane') return;

    agent.timer -= step;
    if (agent.timer > 0) return;
    const target = this.chooseTarget(agent);
    if (target === agent.deck) { agent.timer = rand(5, 15); return; }
    this.dispatch(agent, target);
  }

  tickTransit(agent, step) {
    const next = agent.path?.[agent.leg];
    if (!next) { this.arrive(agent); return; }
    const dx = next.x - agent.x;
    const dy = next.y - agent.y;
    const dist = Math.hypot(dx, dy);
    const v = agent.speed * step;
    if (dist <= v) {
      agent.x = next.x; agent.y = next.y;
      agent.leg += 1;
      if (agent.leg >= agent.path.length) this.arrive(agent);
      return;
    }
    agent.x += (dx / dist) * v;
    agent.y += (dy / dist) * v;
    agent.hx = dx / dist;
    agent.hy = dy / dist;
    agent.step += v * 0.42;
  }

  arrive(agent) {
    agent.state = 'work';
    agent.path = null;
    agent.timer = rand(7, 20);
    const p = interiorPoint(ROOM_BY_ID[agent.deck]);
    agent.tx = p.x; agent.ty = p.y;
    if (agent.kind !== 'arcane') {
      this.store.trace(`${agent.name} reached ${ROOM_BY_ID[agent.deck].name}`);
    }
  }

  agentAt(x, y, radius = 8) {
    let best = null;
    let bestD = radius;
    for (const a of this.everyone()) {
      const d = Math.hypot(a.x - x, a.y - (y + 5));
      if (d < bestD) { bestD = d; best = a; }
    }
    return best;
  }
}

/* ==== src/render/props.js ==== */
/**
 * Prop painters — the furniture that makes each room its own place.
 * Every painter draws in raw pixel coordinates on the low-res buffer.
 */


const R = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x | 0, y | 0, Math.max(1, w | 0), Math.max(1, h | 0)); };

/** A slab with a lit top edge and a dark base — reads as a solid object. */
function slab(c, x, y, w, h, top, body, base) {
  R(c, x, y, w, h, body);
  R(c, x, y, w, 1, top);
  R(c, x, y + h - 1, w, 1, base || '#0b0b12');
}

const blink = (t, seed, rate = 1.6) => (Math.sin(t * rate + seed * 2.3) > 0.1);

const PROPS = {
  /* ---- command ---- */
  viewport(c, x, y, w, h, a, t) {
    R(c, x, y, w, h, '#070711');
    for (let i = 0; i < w; i += 3) {
      const v = Math.sin(i * 0.4 + t * 0.6);
      R(c, x + i, y + 1, 2, h - 2, v > 0.4 ? '#1b2f52' : v > -0.2 ? '#12203a' : '#0c1526');
    }
    R(c, x, y, w, 1, PX.wallTop);
    // a slow star drifting past the glass
    R(c, x + ((t * 6) % w | 0), y + 2 + ((Math.sin(t) * 2) | 0), 1, 1, '#9fb6e8');
  },
  console(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, PX.wallTop, PX.wall);
    for (let i = 0; i < 4; i++) {
      R(c, x + 2 + i * 3, y + 2, 2, 2, blink(t, i) ? a : PX.faint);
    }
    R(c, x + 1, y + h - 3, w - 2, 2, '#0e1424');
  },
  holo(c, x, y, w, h, a, t) {
    const cx = x + w / 2;
    const cy = y + h / 2;
    const r = (w / 2) * (0.72 + Math.sin(t * 1.3) * 0.06);
    c.fillStyle = a;
    c.globalAlpha = 0.22;
    c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 0.55;
    c.beginPath(); c.arc(cx, cy, r * 0.5, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 1;
    R(c, x, y + h - 1, w, 1, a);
  },
  terminal(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, PX.wallTop, PX.wall);
    R(c, x + 1, y + 1, w - 2, h - 4, '#081018');
    for (let i = 1; i < h - 4; i += 2) {
      R(c, x + 2, y + 1 + i, Math.max(1, (w - 4) * (0.4 + 0.6 * Math.abs(Math.sin(i + t)))), 1, a);
    }
  },
  floorlight(c, x, y, w, h, a, t) {
    c.globalAlpha = 0.5 + Math.sin(t * 1.1) * 0.15;
    R(c, x, y, w, h, a);
    c.globalAlpha = 0.14;
    R(c, x - 1, y - 2, w + 2, h + 4, a);
    c.globalAlpha = 1;
  },

  /* ---- build ---- */
  rack(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, PX.wallTop, '#1b1b28');
    for (let r = 0; r < (h - 4) / 4; r++) {
      const ry = y + 3 + r * 4;
      R(c, x + 1, ry, w - 2, 3, '#101019');
      R(c, x + 2, ry + 1, 1, 1, blink(t, r, 3) ? PX.vital : '#1e3a2c');
      R(c, x + 4, ry + 1, 1, 1, blink(t, r + 7, 2.2) ? a : '#1a2a3a');
    }
  },
  bench(c, x, y, w, h, a) { slab(c, x, y, w, h, '#4a4436', '#332f26'); },
  screen(c, x, y, w, h, a, t) {
    R(c, x, y, w, h, '#0a0a12');
    R(c, x + 1, y + 1, w - 2, h - 2, '#05080f');
    const lines = Math.max(1, (h - 3) / 2 | 0);
    for (let i = 0; i < lines; i++) {
      const len = (w - 4) * (0.3 + 0.7 * Math.abs(Math.sin(i * 1.7 + t * 0.8)));
      R(c, x + 2, y + 2 + i * 2, len, 1, a);
    }
    c.globalAlpha = 0.18; R(c, x - 1, y - 1, w + 2, h + 2, a); c.globalAlpha = 1;
  },
  crate(c, x, y, w, h) {
    slab(c, x, y, w, h, '#5a4a32', '#3d3222');
    R(c, x + 1, y + 2, w - 2, 1, '#241d13');
    R(c, x + 1, y + h - 3, w - 2, 1, '#241d13');
  },
  cable(c, x, y, w, h, a, t) {
    for (let i = 0; i < h; i += 2) {
      R(c, x + (Math.sin(i * 0.5 + t) > 0 ? 0 : 1), y + i, w, 2, '#1d2430');
    }
  },
  plant(c, x, y, w, h) {
    R(c, x + w / 4, y + h - 4, w / 2, 4, '#4a3a2a');
    R(c, x + 1, y, w - 2, h - 4, '#2f6b45');
    R(c, x + 2, y + 1, 2, 2, '#48a06a');
    R(c, x + w - 4, y + 2, 2, 2, '#48a06a');
  },

  /* ---- broadcast ---- */
  dish(c, x, y, w, h, a, t) {
    const cx = x + w / 2, cy = y + h / 2;
    c.fillStyle = '#1e1e2c';
    c.beginPath(); c.arc(cx, cy, w / 2, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#12121c';
    c.beginPath(); c.arc(cx, cy, w / 2 - 2, 0, Math.PI * 2); c.fill();
    for (let i = 1; i <= 3; i++) {
      const ph = Math.max(0, Math.min(1, (t * 0.5 + i / 3) % 1));
      const r = Math.max(0.1, (w / 2 - 2) * ph);
      c.globalAlpha = 0.5 * (1 - ph);
      c.strokeStyle = a; c.lineWidth = 1;
      c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.stroke();
    }
    c.globalAlpha = 1;
    R(c, cx - 1, cy - 1, 2, 2, a);
  },
  desk(c, x, y, w, h) { slab(c, x, y, w, h, '#3e3a4e', '#282436'); },
  mic(c, x, y, w, h, a, t) {
    R(c, x + w / 2 - 1, y + 2, 2, h - 2, '#33333f');
    R(c, x, y, w, 3, blink(t, 3, 1.1) ? PX.breach : '#4a2830');
  },

  /* ---- lab ---- */
  fridge(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, '#3c4a5a', '#1e2733');
    R(c, x + 2, y + 3, w - 4, h - 8, '#0d1a24');
    for (let i = 0; i < 3; i++) R(c, x + 3, y + 5 + i * 4, w - 6, 2, blink(t, i, 0.7) ? PX.cyan : '#17384a');
    R(c, x + w - 3, y + h / 2, 2, 4, '#5a6a7a');
  },
  vat(c, x, y, w, h, a, t) {
    R(c, x, y, w, h, '#1a1a26');
    R(c, x + 1, y + 1, w - 2, h - 2, '#0d0d16');
    const lvl = h * (0.45 + Math.sin(t * 0.8 + x) * 0.06);
    c.globalAlpha = 0.8;
    R(c, x + 1, y + h - 1 - lvl, w - 2, lvl, a);
    c.globalAlpha = 1;
    R(c, x, y, w, 2, '#3a3a4e');
    R(c, x + 2, y + h - 3 - lvl, 1, 1, '#ffffff');
  },
  vials(c, x, y, w, h, a, t) {
    for (let i = 0; i < w; i += 4) {
      R(c, x + i, y, 2, h, i % 8 === 0 ? a : PX.cyan);
      R(c, x + i, y, 2, 1, '#cfd6ff');
    }
  },
  centrifuge(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, '#4a4a5e', '#24242f');
    const cx = x + w / 2, cy = y + h / 2;
    const ang = t * 6;
    R(c, cx + Math.cos(ang) * 3 - 1, cy + Math.sin(ang) * 3 - 1, 2, 2, a);
    R(c, cx - Math.cos(ang) * 3 - 1, cy - Math.sin(ang) * 3 - 1, 2, 2, a);
  },
  conveyor(c, x, y, w, h, a, t) {
    R(c, x, y, w, h, '#16161f');
    const off = (t * 9) % 6;
    for (let i = -6; i < w; i += 6) R(c, x + i + off, y + 1, 3, h - 2, '#262634');
    R(c, x, y, w, 1, '#31313f');
  },


  /* ---- lab: racks, instruments, distribution ---- */
  vialrack(c, x, y, w, h, a, t, opt) {
    // GHK-Cu really is blue; most other lyophilised compounds read clear/straw.
    const liquid = opt === 'ghk' ? '#2f7fd6' : opt === 'amber' ? '#c98f3a' : '#9fb4c8';
    const cap = opt === 'ghk' ? '#5fa8f0' : '#d8dde8';
    R(c, x, y + h - 3, w, 3, '#2a2a38');
    R(c, x, y + h - 3, w, 1, '#3c3c50');
    for (let i = 1; i < w - 2; i += 4) {
      const vh = h - 5;
      R(c, x + i, y + 2, 3, vh, '#0e1520');
      R(c, x + i, y + 2 + vh * 0.38, 3, vh * 0.62, liquid);
      R(c, x + i, y + 2 + vh * 0.38, 3, 1, cap);
      R(c, x + i, y, 3, 2, cap);
      R(c, x + i, y + 3 + vh * 0.4, 1, 1, '#ffffff');
    }
    c.globalAlpha = 0.12 + Math.sin(t * 1.4 + x) * 0.04;
    R(c, x - 1, y - 1, w + 2, h + 2, liquid);
    c.globalAlpha = 1;
  },
  microscope(c, x, y, w, h, a, t) {
    R(c, x, y + h - 3, w, 3, '#33333f');
    R(c, x + w / 2 - 1, y + 3, 3, h - 6, '#4a4a5c');
    R(c, x + 1, y + 1, w - 4, 4, '#2a2a36');
    R(c, x + 2, y + h - 6, w - 4, 2, '#1a1a24');
    R(c, x + w / 2, y + h - 6, 1, 1, blink(t, 2, 1.2) ? a : '#26263a');
  },
  scales(c, x, y, w, h, a, t) {
    R(c, x, y + h - 3, w, 3, '#3a3a48');
    R(c, x + 1, y + 1, w - 2, h - 4, '#1e1e2a');
    const v = (Math.sin(t * 1.7 + x) * 0.5 + 0.5);
    for (let i = 0; i < 3; i++) R(c, x + 2 + i * 3, y + 3, 2, 1, i / 3 < v ? a : '#2c2c3c');
  },
  autoclave(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, '#4a4a5e', '#22222e');
    const cx = x + w / 2, cy = y + h / 2 - 1;
    c.fillStyle = '#0c1218';
    c.beginPath(); c.arc(cx, cy, w / 3, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 0.5 + Math.sin(t * 1.1) * 0.25;
    c.fillStyle = a;
    c.beginPath(); c.arc(cx, cy, w / 5, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 1;
    R(c, x + 2, y + h - 3, w - 4, 1, blink(t, 5, 0.9) ? PX.vital : '#243a30');
  },
  packstation(c, x, y, w, h, a, t) {
    slab(c, x, y + h - 8, w, 8, '#4a4436', '#332f26');
    R(c, x + 2, y + h - 16, 8, 8, '#5a4a32');
    R(c, x + 2, y + h - 16, 8, 1, '#7a663f');
    R(c, x + 3, y + h - 14, 6, 1, '#241d13');
    R(c, x + 13, y + h - 13, 6, 5, '#d8d4c4');
    R(c, x + w - 7, y + h - 15, 5, 7, '#2a2a38');
    R(c, x + w - 6, y + h - 14, 3, 2, blink(t, 1, 1.4) ? a : '#1c2230');
  },
  shipbox(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, '#6a5636', '#43361f');
    R(c, x + 1, y + 2, w - 2, 1, '#2a2113');
    R(c, x + 2, y + h - 5, w - 5, 3, '#d8d4c4');
    R(c, x + 3, y + h - 4, w - 7, 1, '#60594a');
  },

  /* ---- library ---- */
  tallshelf(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, '#3e3222', '#241d14');
    const rows = Math.floor((h - 4) / 5);
    for (let r = 0; r < rows; r++) {
      const ry = y + 2 + r * 5;
      for (let i = 1; i < w - 2; i += 2) {
        const seed = (i * 5 + r * 11 + x) % 6;
        const col = ['#6a4a7a', '#4a5a7a', '#7a4a4a', '#4a7a5a', '#7a6a3a', '#5a4a6a'][seed];
        const tall = (i + r) % 4 === 0 ? 4 : 3;
        R(c, x + i, ry + (4 - tall), 2, tall, col);
      }
      R(c, x + 1, ry + 4, w - 2, 1, '#171009');
    }
  },
  ladder(c, x, y, w, h) {
    R(c, x, y, 2, h, '#5a4630');
    R(c, x + w - 2, y, 2, h, '#5a4630');
    for (let i = 3; i < h; i += 5) R(c, x, y + i, w, 1, '#6d553a');
  },
  readingdesk(c, x, y, w, h, a, t) {
    slab(c, x, y + h - 7, w, 7, '#4a3a2a', '#2c2218');
    // an open book, pages catching the lamp
    R(c, x + 4, y + h - 13, w / 2 - 2, 6, '#e8e2cf');
    R(c, x + w / 2 + 2, y + h - 13, w / 2 - 6, 6, '#d8d2bf');
    R(c, x + w / 2, y + h - 13, 1, 6, '#9a937f');
    R(c, x + w - 7, y + h - 16, 2, 9, '#3a3a48');
    R(c, x + w - 9, y + h - 18, 6, 3, PX.flare);
    c.globalAlpha = 0.16 + Math.sin(t * 1.2) * 0.05;
    R(c, x + w - 14, y + h - 16, 14, 10, PX.flare);
    c.globalAlpha = 1;
  },
  printer(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h - 5, '#3c3c4c', '#20202c');
    R(c, x + 2, y + 2, w - 4, 3, '#12121a');
    R(c, x + 3, y + 3, (w - 6) * (0.3 + 0.7 * Math.abs(Math.sin(t * 0.9))), 1, a);
    // sheet easing out of the tray
    const out = 3 + Math.abs(Math.sin(t * 0.6)) * 4;
    R(c, x + 3, y + h - 5, w - 6, out, '#e4e0d2');
    R(c, x + 4, y + h - 4, w - 9, 1, '#b3ae9e');
  },
  pdfstack(c, x, y, w, h, a, t) {
    for (let i = 0; i < 4; i++) {
      const oy = y + h - 4 - i * 3;
      R(c, x + i, oy, w - 8, 3, i === 3 ? '#f0ece0' : '#cfc9ba');
      R(c, x + i, oy, w - 8, 1, '#ffffff');
    }
    R(c, x + w - 9, y + 1, 8, h - 8, '#0c1018');
    for (let i = 0; i < 3; i++) {
      R(c, x + w - 8, y + 3 + i * 3, 6 * (0.4 + 0.6 * Math.abs(Math.sin(i + t))), 1, a);
    }
  },

  /* ---- medical ---- */
  bed(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, '#cdd3e0', '#7e8494');
    R(c, x + 1, y + 2, w - 2, h - 4, '#aeb6c6');
    R(c, x + 2, y + 3, 6, h - 6, '#dfe4ee');
    c.globalAlpha = 0.25 + Math.sin(t * 1.4 + y) * 0.1;
    R(c, x, y + h - 1, w, 1, a);
    c.globalAlpha = 1;
  },
  monitor(c, x, y, w, h, a, t) {
    R(c, x, y, w, h, '#0c1014');
    R(c, x + 1, y + 1, w - 2, h - 2, '#060a0c');
    const mid = y + h / 2;
    for (let i = 0; i < w - 2; i++) {
      const p = ((i + t * 10) % (w - 2)) / (w - 2);
      const beat = p < 0.12 ? Math.sin(p * 26) * 3 : 0;
      R(c, x + 1 + i, mid - beat, 1, 1, a);
    }
  },
  chart(c, x, y, w, h, a, t) {
    R(c, x, y, w, h, '#0a0e12');
    R(c, x, y, w, 1, '#1e2630');
    for (let i = 0; i < w - 2; i += 2) {
      const v = (Math.sin(i * 0.3) + Math.sin(i * 0.11 + t * 0.3)) * 0.25 + 0.5;
      R(c, x + 1 + i, y + h - 1 - v * (h - 3), 2, v * (h - 3), a);
    }
  },

  /* ---- treasury ---- */
  safe(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, '#4e4636', '#2a261c');
    R(c, x + 2, y + 3, w - 4, h - 6, '#1c1912');
    const cx = x + w / 2, cy = y + h / 2;
    c.strokeStyle = PX.gold; c.lineWidth = 1;
    c.beginPath(); c.arc(cx, cy, 4, 0, Math.PI * 2); c.stroke();
    R(c, cx + Math.cos(t * 0.7) * 3 - 0.5, cy + Math.sin(t * 0.7) * 3 - 0.5, 1, 1, PX.gold);
  },
  bullion(c, x, y, w, h) {
    slab(c, x, y, w, h, '#f0cd77', PX.gold, '#8a6420');
  },
  ledgerdesk(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, '#4a4034', '#2e2820');
    for (let i = 0; i < 4; i++) R(c, x + 3 + i * 4, y + 3, 3, h - 7, '#d9cba8');
    R(c, x + 2, y + h - 3, w - 4, 1, PX.gold);
  },
  pillar(c, x, y, w, h) {
    slab(c, x, y, w, h, PX.wallTop, PX.wall, '#090910');
  },

  /* ---- archive & press ---- */
  shelf(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, '#3a3020', '#241d14');
    for (let r = 0; r < (h - 4) / 6; r++) {
      const ry = y + 2 + r * 6;
      for (let i = 1; i < w - 2; i += 2) {
        const seed = (i * 7 + r * 13 + x) % 5;
        const col = ['#6a4a7a', '#4a5a7a', '#7a4a4a', '#4a7a5a', '#7a6a3a'][seed];
        R(c, x + i, ry, 2, 4, col);
      }
      R(c, x + 1, ry + 4, w - 2, 1, '#171009');
    }
  },
  papers(c, x, y, w, h) {
    for (let i = 0; i < w; i += 5) {
      R(c, x + i, y + (i % 3), 4, h, '#d8d4c4');
      R(c, x + i, y + (i % 3), 4, 1, '#f2eee0');
    }
  },
  press(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, '#4a3a3a', '#2c2222');
    R(c, x + 2, y + 3, w - 4, 4, '#141010');
    const p = (t * 0.8) % 1;
    R(c, x + 3, y + h - 6, (w - 6) * p, 3, a);
    R(c, x + 2, y + h - 2, w - 4, 1, '#6a4a4a');
  },
  candle(c, x, y, w, h, a, t) {
    R(c, x, y + 2, w, h - 2, '#d8d0b8');
    const f = Math.sin(t * 9) > 0 ? 0 : 1;
    R(c, x + 1, y - f, w - 2, 2 + f, PX.flare);
    c.globalAlpha = 0.2; R(c, x - 2, y - 3, w + 4, h + 4, PX.flare); c.globalAlpha = 1;
  },

  /* ---- sanctum ---- */
  rig(c, x, y, w, h, a, t) {
    R(c, x, y + h - 3, w, 3, '#22222e');
    R(c, x + 2, y, 3, h - 3, '#2e2e3c');
    R(c, x + w - 5, y, 3, h - 3, '#2e2e3c');
    R(c, x + 2, y + 3, w - 4, 2, '#4a4a5a');
    R(c, x, y + 6, 4, 4, '#1a1a24'); R(c, x + w - 4, y + 6, 4, 4, '#1a1a24');
  },
  mat(c, x, y, w, h, a) {
    R(c, x, y, w, h, '#1e3a30');
    R(c, x + 1, y + 1, w - 2, h - 2, '#24483a');
    R(c, x + w / 2 - 1, y + 2, 2, h - 4, '#2f6b45');
  },


  /* ---- architecture & services ---- */
  pipes(c, x, y, w, h, a, t) {
    R(c, x, y, w, h, '#242432');
    R(c, x, y, w, 1, '#3a3a50');
    R(c, x, y + h - 1, w, 1, '#0e0e16');
    for (let i = 6; i < w; i += 14) {
      R(c, x + i, y - 1, 3, h + 2, '#32324a');
      R(c, x + i, y - 1, 3, 1, '#4a4a68');
    }
    const p = (t * 12) % (w + 20) - 10;
    if (p > 0 && p < w) { c.globalAlpha = 0.5; R(c, x + p, y + 1, 4, 1, a); c.globalAlpha = 1; }
  },
  cablerun(c, x, y, w, h, a, t) {
    const vert = h > w;
    for (let i = 0; i < (vert ? h : w); i += 1) {
      const j = Math.sin(i * 0.4) > 0 ? 0 : 1;
      if (vert) R(c, x + j, y + i, 2, 1, '#1d2230');
      else R(c, x + i, y + j, 1, 2, '#1d2230');
    }
    const p = ((t * 18) % (vert ? h : w)) | 0;
    c.globalAlpha = 0.7;
    if (vert) R(c, x, y + p, 2, 2, a); else R(c, x + p, y, 2, 2, a);
    c.globalAlpha = 1;
  },
  ceilinglight(c, x, y, w, h, a, t) {
    const flick = 0.82 + Math.sin(t * 3.1 + x) * 0.05;
    R(c, x, y, w, h, '#c8cadd');
    R(c, x, y + h, w, 1, '#5a5c70');
    c.globalAlpha = 0.09 * flick;
    for (let i = 1; i <= 5; i++) {
      R(c, x - i * 2, y + h, w + i * 4, i * 4, '#cfd4ff');
    }
    c.globalAlpha = 1;
  },
  vent(c, x, y, w, h) {
    R(c, x, y, w, h, '#1a1a26');
    R(c, x, y, w, 1, '#33334a');
    for (let i = 1; i < h - 1; i += 2) R(c, x + 1, y + i, w - 2, 1, '#0c0c14');
  },
  panel(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, PX.wallTop, '#20202e');
    R(c, x + 2, y + 2, w - 4, h - 4, '#14141f');
    for (let i = 0; i < 3; i++) R(c, x + 3 + i * 3, y + 3, 2, 1, blink(t, i + x, 1.3) ? a : '#252538');
  },
  bolt(c, x, y, w, h) { R(c, x, y, w, h, PX.wallLip); R(c, x, y, 1, 1, '#6a6a90'); },
  hazard(c, x, y, w, h) {
    for (let i = 0; i < w; i += 4) {
      R(c, x + i, y, 2, h, '#c8a23a');
      R(c, x + i + 2, y, 2, h, '#1a1a22');
    }
    c.globalAlpha = 0.25; R(c, x, y, w, h, '#000000'); c.globalAlpha = 1;
  },
  sign(c, x, y, w, h, a, t, opt) {
    R(c, x, y, w, h, '#0b0b13');
    R(c, x, y, w, 1, '#2c2c40');
    const label = String(opt || '');
    const cols = Math.max(1, Math.floor((w - 3) / (label.length || 1)));
    for (let i = 0; i < label.length; i++) {
      if (label[i] === ' ') continue;
      R(c, x + 2 + i * cols, y + 2, Math.max(1, cols - 1), h - 4, a);
    }
    c.globalAlpha = 0.18; R(c, x - 1, y - 1, w + 2, h + 2, a); c.globalAlpha = 1;
  },

  /* ---- command ---- */
  holotable(c, x, y, w, h, a, t) {
    R(c, x, y + h - 5, w, 5, '#22222f');
    R(c, x, y + h - 5, w, 1, '#3a3a52');
    const cx = x + w / 2, cy = y + h / 2 - 1;
    for (let i = 0; i < 3; i++) {
      // canvas rejects a negative radius outright, so never hand it one
      const ph = Math.max(0, Math.min(1, (t * 0.35 + i / 3) % 1));
      c.globalAlpha = 0.35 * (1 - ph);
      c.strokeStyle = a; c.lineWidth = 1;
      c.beginPath();
      c.ellipse(cx, cy, Math.max(0.1, (w / 2) * ph), Math.max(0.1, (h / 3) * ph), 0, 0, Math.PI * 2);
      c.stroke();
    }
    c.globalAlpha = 0.5;
    c.fillStyle = a;
    c.beginPath(); c.ellipse(cx, cy, 4, 2.5, 0, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 0.14;
    R(c, x + 2, y, w - 4, h - 4, a);
    c.globalAlpha = 1;
  },
  chair(c, x, y, w, h) {
    R(c, x + 1, y + h - 2, w - 2, 2, '#22222e');
    R(c, x, y + 2, w, h - 3, '#33333f');
    R(c, x, y, w, 3, '#3e3e4e');
    R(c, x + 1, y + 3, w - 2, 1, '#1a1a24');
  },

  /* ---- forge ---- */
  cablespool(c, x, y, w, h, a, t) {
    R(c, x, y + 1, w, h - 2, '#2a2438');
    R(c, x, y + 1, w, 1, '#3e3650');
    for (let i = 2; i < h - 2; i += 2) R(c, x + 1, y + i, w - 2, 1, a);
    R(c, x, y, 2, h, '#1b1726'); R(c, x + w - 2, y, 2, h, '#1b1726');
  },
  toolwall(c, x, y, w, h, a, t) {
    R(c, x, y, w, h, '#191924');
    for (let i = 2; i < w - 2; i += 5) {
      const k = (i + x) % 4;
      if (k === 0) { R(c, x + i, y + 1, 1, h - 2, '#6a6a80'); R(c, x + i - 1, y + 1, 3, 2, '#4a4a60'); }
      else if (k === 1) { R(c, x + i, y + 2, 3, h - 4, '#5a4a3a'); }
      else if (k === 2) { R(c, x + i, y + 1, 2, h - 3, '#7a7a90'); }
      else { R(c, x + i, y + 2, 3, 3, '#4a5a6a'); }
    }
  },
  oscilloscope(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, '#4a4a5e', '#22222e');
    R(c, x + 2, y + 2, w - 4, h - 6, '#05100c');
    const mid = y + 2 + (h - 6) / 2;
    for (let i = 0; i < w - 5; i++) {
      const v = Math.sin((i + t * 22) * 0.45) * ((h - 8) / 2.4);
      R(c, x + 3 + i, mid + v, 1, 1, PX.vital);
    }
    R(c, x + 2, y + h - 3, 2, 1, blink(t, 1, 2) ? a : '#26263a');
  },
  armbot(c, x, y, w, h, a, t) {
    // pedestal
    R(c, x + w / 2 - 4, y + h - 5, 8, 5, '#2e2e3c');
    R(c, x + w / 2 - 4, y + h - 5, 8, 1, '#46465e');
    const sw = Math.sin(t * 1.1);
    const j1x = x + w / 2 + sw * (w * 0.18);
    const j1y = y + h - 12;
    const j2x = j1x + sw * (w * 0.3);
    const j2y = j1y - h * 0.28;
    c.strokeStyle = '#c98f3a'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(x + w / 2, y + h - 5); c.lineTo(j1x, j1y); c.lineTo(j2x, j2y); c.stroke();
    c.strokeStyle = '#7a5a24'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x + w / 2, y + h - 5); c.lineTo(j1x, j1y); c.lineTo(j2x, j2y); c.stroke();
    R(c, j1x - 1, j1y - 1, 3, 3, '#e8b64c');
    R(c, j2x - 1, j2y - 1, 3, 3, '#e8b64c');
    c.globalAlpha = 0.5 + Math.sin(t * 6) * 0.3;
    R(c, j2x - 1, j2y + 2, 2, 2, a);
    c.globalAlpha = 1;
  },
  barrel(c, x, y, w, h, a, t) {
    R(c, x, y + 1, w, h - 1, '#3a4a3a');
    R(c, x, y, w, 2, '#52684f');
    R(c, x, y + 3, w, 1, '#22301f');
    R(c, x, y + h - 4, w, 1, '#22301f');
    R(c, x + 1, y + 5, w - 2, 3, blink(t, x, 0.8) ? PX.flare : '#5a5a3a');
  },

  /* ---- beacon ---- */
  mast(c, x, y, w, h, a, t) {
    for (let i = 0; i < h; i += 4) {
      R(c, x, y + i, w, 1, '#3a3a50');
      R(c, x + 1, y + i, 1, 4, '#2a2a3c');
    }
    R(c, x, y, w, 2, '#4a4a64');
    c.globalAlpha = blink(t, 0, 1.1) ? 0.9 : 0.15;
    R(c, x + 1, y - 3, 2, 3, PX.breach);
    c.globalAlpha = 1;
  },
  mixdesk(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, '#3e3a4e', '#242034');
    for (let i = 0; i < w - 6; i += 5) {
      const lv = (Math.sin(t * 2 + i) * 0.5 + 0.5);
      R(c, x + 3 + i, y + 3, 2, h - 8, '#14141e');
      R(c, x + 3 + i, y + 3 + (h - 9) * (1 - lv), 2, 2, a);
    }
    R(c, x + 2, y + h - 3, w - 4, 1, '#5a5470');
  },
  speaker(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, '#33333f', '#1c1c26');
    const cx = x + w / 2;
    const pulse = 1 + Math.sin(t * 5) * 0.1;
    c.fillStyle = '#0c0c12';
    c.beginPath(); c.arc(cx, y + h * 0.32, Math.max(0.1, (w / 2 - 2) * pulse), 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(cx, y + h * 0.72, Math.max(0.1, (w / 2 - 3) * pulse), 0, Math.PI * 2); c.fill();
    R(c, cx - 1, y + h * 0.32 - 1, 2, 2, '#3a3a4a');
  },

  /* ---- lab ---- */
  fumehood(c, x, y, w, h, a, t) {
    R(c, x, y, w, h, '#0e1620');
    R(c, x, y, w, 3, '#2c3a4a');
    R(c, x, y, w, 1, '#44586c');
    R(c, x, y + h - 2, w, 2, '#22303c');
    // sash glass
    c.globalAlpha = 0.16 + Math.sin(t * 0.9) * 0.04;
    R(c, x + 2, y + 4, w - 4, h - 8, PX.cyan);
    c.globalAlpha = 1;
    for (let i = 6; i < w; i += 9) R(c, x + i, y + 3, 1, h - 5, '#1a2836');
    R(c, x + 2, y + 3, 3, 1, blink(t, 2, 0.7) ? PX.vital : '#24402f');
  },
  biohazard(c, x, y, w, h, a, t) {
    R(c, x, y, w, h, '#1a1508');
    R(c, x, y, w, 1, '#3a3218');
    const cx = x + w / 2, cy = y + h / 2;
    c.fillStyle = PX.flare;
    for (let i = 0; i < 3; i++) {
      const ang = (i / 3) * Math.PI * 2 - Math.PI / 2;
      c.beginPath();
      c.arc(cx + Math.cos(ang) * 2, cy + Math.sin(ang) * 2, 1.6, 0, Math.PI * 2);
      c.fill();
    }
    R(c, cx - 1, cy - 1, 2, 2, '#1a1508');
  },
  pallet(c, x, y, w, h) {
    R(c, x, y, w, h, '#4a3a26');
    for (let i = 0; i < w; i += 6) R(c, x + i, y, 1, h, '#2c2214');
    R(c, x, y, w, 1, '#5e4a30');
  },

  /* ---- vitals ---- */
  ivstand(c, x, y, w, h, a, t) {
    R(c, x + w / 2 - 1, y + 2, 2, h - 4, '#5a6070');
    R(c, x + 1, y + h - 3, w - 2, 2, '#3a4050');
    R(c, x, y, w, 5, '#cfe8de');
    const drip = (t * 2) % 1;
    R(c, x + w / 2 - 1, y + 6 + drip * 5, 1, 2, PX.cyan);
  },
  curtain(c, x, y, w, h, a, t) {
    for (let i = 0; i < h; i += 2) {
      const wob = Math.sin(i * 0.3 + t * 0.7) > 0 ? 0 : 1;
      R(c, x + wob, y + i, w, 2, i % 4 === 0 ? '#3a4a52' : '#2e3c44');
    }
    R(c, x - 1, y, w + 2, 1, '#5a6a72');
  },
  cabinet(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, '#c8cdd8', '#7e8492');
    R(c, x + 2, y + 3, w - 4, h - 6, '#0e1a20');
    for (let r = 0; r < 3; r++) {
      R(c, x + 3, y + 5 + r * 5, w - 6, 3, '#1c3440');
      R(c, x + 4, y + 6 + r * 5, 2, 1, r === 0 ? PX.vital : '#2c4a56');
    }
    R(c, x + w - 3, y + h / 2, 1, 4, '#5a6472');
  },

  /* ---- vault ---- */
  camera(c, x, y, w, h, a, t) {
    R(c, x, y, w, h - 2, '#2e2e3c');
    R(c, x, y, w, 1, '#46465e');
    const sw = Math.sin(t * 0.8) * 2;
    R(c, x + w / 2 - 1 + sw, y + h - 2, 3, 2, '#1a1a24');
    c.globalAlpha = blink(t, 3, 1.4) ? 0.9 : 0.2;
    R(c, x + w / 2 + sw, y + h - 1, 1, 1, PX.breach);
    c.globalAlpha = 1;
  },
  strongbox(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, '#4e4636', '#2a261c');
    R(c, x + 2, y + 3, w - 4, h - 6, '#1c1912');
    R(c, x + w / 2 - 2, y + h / 2 - 1, 4, 2, PX.gold);
  },
  counter(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, '#4a4a5e', '#22222e');
    R(c, x + 2, y + 2, w - 4, 4, '#0c1018');
    const n = Math.floor(t * 6) % 4;
    for (let i = 0; i < 4; i++) R(c, x + 3 + i * 3, y + 3, 2, 2, i <= n ? PX.gold : '#2a2a38');
    R(c, x + 2, y + h - 4, w - 4, 2, '#d8d4c4');
  },

  /* ---- library & scriptorium ---- */
  bookstack(c, x, y, w, h) {
    const cols = ['#6a4a7a', '#4a5a7a', '#7a4a4a', '#4a7a5a', '#7a6a3a'];
    for (let i = 0; i < h; i += 2) {
      const wd = w - ((i / 2) % 3);
      R(c, x, y + h - 2 - i, wd, 2, cols[(i / 2 + x) % cols.length]);
      R(c, x, y + h - 2 - i, wd, 1, '#ffffff22');
    }
  },
  catalogue(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, '#4a3a2a', '#2a2014');
    for (let i = 2; i < w - 2; i += 6) {
      R(c, x + i, y + 2, 5, h - 4, '#3a2c1e');
      R(c, x + i + 1, y + 3, 3, 1, '#b8a882');
      R(c, x + i + 2, y + h - 4, 1, 1, '#8a7a5a');
    }
  },
  typewriter(c, x, y, w, h, a, t) {
    R(c, x, y + h - 3, w, 3, '#2a2a36');
    R(c, x + 1, y + 3, w - 2, h - 5, '#3a3a48');
    R(c, x + 1, y + 3, w - 2, 1, '#52526a');
    R(c, x + 3, y, w - 6, 4, '#e8e2cf');
    for (let i = 2; i < w - 3; i += 3) R(c, x + i, y + h - 5, 2, 2, '#14141c');
  },
  inkpot(c, x, y, w, h, a, t) {
    R(c, x + 1, y + 2, w - 2, h - 2, '#1a1a28');
    R(c, x, y + h - 2, w, 2, '#2a2a3a');
    R(c, x + 1, y + 2, w - 2, 1, '#3a2a4a');
    R(c, x + w - 2, y - 2, 1, 5, '#c8b48a');
  },

  /* ---- sanctum ---- */
  weights(c, x, y, w, h) {
    R(c, x, y + h / 2 - 1, w, 2, '#6a6a80');
    R(c, x, y + 1, 4, h - 2, '#22222e');
    R(c, x + w - 4, y + 1, 4, h - 2, '#22222e');
    R(c, x, y + 1, 4, 1, '#3a3a4e');
    R(c, x + w - 4, y + 1, 4, 1, '#3a3a4e');
  },
  window(c, x, y, w, h, a, t) {
    R(c, x, y, w, h, '#0a1420');
    R(c, x, y, w, 2, '#2c3a4a');
    R(c, x, y + h - 2, w, 2, '#1c2836');
    for (let i = 0; i < w; i += 3) {
      const v = Math.sin(i * 0.3 + t * 0.15);
      R(c, x + i, y + 2, 2, h - 4, v > 0.5 ? '#16324e' : v > 0 ? '#102438' : '#0c1a2a');
    }
    const sx = ((t * 4) % (w + 10)) - 5;
    if (sx > 0 && sx < w) R(c, x + sx, y + 3 + (Math.sin(t) * 2 | 0), 1, 1, '#a8c0e8');
    for (let i = 8; i < w; i += 11) R(c, x + i, y + 2, 1, h - 4, '#2c3a4a');
  },
  shower(c, x, y, w, h, a, t) {
    R(c, x, y, w, h, '#182028');
    R(c, x, y, w, 1, '#38424e');
    R(c, x + 1, y + 1, w - 2, h - 2, '#101820');
    R(c, x + w / 2 - 2, y + 2, 4, 2, '#6a7280');
    for (let i = 0; i < 5; i++) {
      const d = ((t * 14) + i * 5) % (h - 6);
      c.globalAlpha = 0.45;
      R(c, x + w / 2 - 2 + (i % 3), y + 5 + d, 1, 2, PX.cyan);
      c.globalAlpha = 1;
    }
    R(c, x + 1, y + h - 3, w - 2, 2, '#1c2a32');
  },
  locker(c, x, y, w, h, a, t) {
    slab(c, x, y, w, h, '#3a4250', '#1e222c');
    R(c, x + 1, y + 2, w - 2, h - 4, '#2a3240');
    R(c, x + w / 2, y + 2, 1, h - 4, '#161c26');
    for (const cx2 of [x + 2, x + w / 2 + 2]) {
      R(c, cx2, y + 4, 3, 1, '#12161e');
      R(c, cx2, y + h / 2, 2, 2, '#5a6472');
    }
  },
};

function paintProp(ctx, type, x, y, w, h, accent, t, opt) {
  const fn = PROPS[type];
  if (fn) fn(ctx, x, y, w, h, accent, t, opt);
  else slab(ctx, x, y, w, h, PX.wallTop, PX.wall);
}

/* ==== src/render/tiles.js ==== */
/**
 * Floor tiles — 8x8 pixel motifs, one set per room type.
 *
 * Each painter draws a single tile. `v` is a wear variant (0-3) chosen
 * from seeded noise, so a floor has texture without repeating visibly.
 * Floors are baked once per room by the renderer and never redrawn.
 */

const T = 8;
const px = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x | 0, y | 0, Math.max(1, w | 0), Math.max(1, h | 0)); };

/** Scatter a few darker specks, deterministically per tile. */
function speck(c, x, y, seed, n, col, alpha) {
  c.globalAlpha = alpha;
  for (let i = 0; i < n; i++) {
    const a = (seed * 9301 + i * 49297) % 233280 / 233280;
    const b = (seed * 4021 + i * 71993) % 233280 / 233280;
    px(c, x + a * T, y + b * T, 1, 1, col);
  }
  c.globalAlpha = 1;
}

const TILES = {
  /** Riveted metal deck plate — the industrial default. */
  plate(c, x, y, v, seed) {
    px(c, x, y, T, T, '#171722');
    px(c, x, y, T, 1, '#1f1f2e');
    px(c, x, y, 1, T, '#1c1c29');
    px(c, x, y + T - 1, T, 1, '#0f0f16');
    px(c, x + T - 1, y, 1, T, '#101018');
    // corner rivets
    px(c, x + 1, y + 1, 1, 1, '#2a2a3e');
    px(c, x + T - 2, y + T - 2, 1, 1, '#0c0c12');
    if (v === 1) { px(c, x + 2, y + 3, 4, 1, '#1b1b28'); px(c, x + 2, y + 4, 3, 1, '#141420'); }
    if (v === 2) speck(c, x, y, seed, 5, '#000000', 0.22);
    if (v === 3) { px(c, x + 3, y + 1, 1, 6, '#131320'); px(c, x + 4, y + 2, 1, 4, '#1d1d2c'); }
  },

  /** Open walkway grating with dark beneath. */
  grate(c, x, y, v, seed) {
    px(c, x, y, T, T, '#101018');
    for (let i = 0; i < T; i += 2) {
      px(c, x, y + i, T, 1, '#1e1e2c');
      px(c, x, y + i, T, 1, i % 4 === 0 ? '#232334' : '#1a1a28');
    }
    px(c, x, y, 1, T, '#26263a');
    px(c, x + T - 1, y, 1, T, '#0b0b12');
    if (v === 2) speck(c, x, y, seed, 4, '#000000', 0.3);
    if (v === 3) px(c, x + 2, y, 1, T, '#2c2c42');
  },

  /** Clean epoxy lab floor — pale, seamed, faintly reflective. */
  lab(c, x, y, v, seed) {
    px(c, x, y, T, T, '#1a2028');
    px(c, x, y, T, 1, '#222a34');
    px(c, x, y, 1, T, '#1e262e');
    px(c, x + T - 1, y, 1, T, '#141a20');
    px(c, x, y + T - 1, T, 1, '#121820');
    if (v === 0) { c.globalAlpha = 0.16; px(c, x + 1, y + 1, 3, 2, '#4a6070'); c.globalAlpha = 1; }
    if (v === 1) speck(c, x, y, seed, 3, '#2c3a46', 0.5);
    if (v === 2) { px(c, x + 4, y + 5, 3, 1, '#16202a'); }
    if (v === 3) { c.globalAlpha = 0.1; px(c, x + 2, y + 2, 5, 4, '#6a8090'); c.globalAlpha = 1; }
  },

  /** Woven carpet — the library reading floor. */
  carpet(c, x, y, v, seed) {
    px(c, x, y, T, T, '#1c1a26');
    for (let i = 0; i < T; i += 2) {
      for (let j = 0; j < T; j += 2) {
        const on = ((i + j) / 2) % 2 === 0;
        px(c, x + i, y + j, 2, 2, on ? '#201e2c' : '#191722');
      }
    }
    if (v === 1) speck(c, x, y, seed, 4, '#2a2638', 0.5);
    if (v === 2) { c.globalAlpha = 0.14; px(c, x, y, T, T, '#000000'); c.globalAlpha = 1; }
    if (v === 3) px(c, x + 1, y + 3, 6, 1, '#241f30');
  },

  /** Planked timber — the scriptorium. */
  wood(c, x, y, v, seed) {
    const tone = ['#241b16', '#28201a', '#211a14', '#2b221b'][v];
    px(c, x, y, T, T, tone);
    px(c, x, y, T, 1, '#31261d');
    px(c, x, y + T - 1, T, 1, '#160f0b');
    // grain
    for (let i = 1; i < T - 1; i += 3) {
      px(c, x + ((seed + i) % 3), y + i, T - 2, 1, '#1d1610');
    }
    if (v === 2) px(c, x + 5, y + 1, 1, 5, '#332920');
  },

  /** Poured concrete — the vault. */
  concrete(c, x, y, v, seed) {
    px(c, x, y, T, T, '#1b1b20');
    speck(c, x, y, seed, 7, '#232329', 0.6);
    speck(c, x, y, seed + 11, 4, '#131317', 0.6);
    if (v === 1) { px(c, x, y + 4, T, 1, '#151519'); }
    if (v === 2) { px(c, x + 3, y, 1, 4, '#141418'); px(c, x + 4, y + 4, 1, 4, '#141418'); }
    if (v === 3) px(c, x, y, T, 1, '#242429');
  },

  /** Rubber matting — the sanctum. */
  mat(c, x, y, v, seed) {
    px(c, x, y, T, T, '#16201c');
    for (let i = 1; i < T; i += 3) {
      for (let j = 1; j < T; j += 3) px(c, x + i, y + j, 2, 2, '#1b2822');
    }
    if (v === 2) { c.globalAlpha = 0.12; px(c, x, y, T, T, '#000000'); c.globalAlpha = 1; }
    if (v === 3) px(c, x, y, T, 1, '#20302a');
  },
};

const TILE_SIZE = T;

/**
 * Paint a whole floor into `ctx` at 0,0 for a w x h room.
 * `seedBase` keeps the wear pattern identical on every load.
 */
function paintFloorTiles(ctx, set, w, h, seedBase) {
  const fn = TILES[set] || TILES.plate;
  for (let ty = 0; ty < h; ty += T) {
    for (let tx = 0; tx < w; tx += T) {
      const seed = (seedBase + tx * 73856093 + ty * 19349663) >>> 0;
      const v = seed % 4;
      fn(ctx, tx, ty, v, seed % 97);
    }
  }
}
