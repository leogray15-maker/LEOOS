/* ============================================================
   Baking
   ============================================================ */

const cache = new Map();

function shade(hex, mul) {
  const n = parseInt(hex.slice(1), 16);
  const f = (v) => Math.max(0, Math.min(255, Math.round(v * mul)));
  return `rgb(${f((n >> 16) & 255)}, ${f((n >> 8) & 255)}, ${f(n & 255)})`;
}

function bake(matrix, colour, kind, mirror) {
  const w = matrix[0].length;
  const h = matrix.length;
  const cv = document.createElement('canvas');
  cv.width = w;
  cv.height = h;
  const c = cv.getContext('2d');

  // Strong internal contrast is what makes a 9px figure read as a person.
  const pal = {
    o: '#0b0b14',                      // lifted off pure black so it reads on dark decks
    c: colour,
    d: shade(colour, 0.48),            // shaded side
    l: shade(colour, 1.62),            // lit side
    e: kind === 'arcane' ? '#ffffff' : '#16121e',  // eyes / visor
    s: '#e2b696',                      // skin
    h: shade(colour, 0.3),             // hair or helm
    k: shade(colour, 0.34),            // cloak fold
    a: shade(colour, 1.85),            // trim
  };

  if (mirror) { c.translate(w, 0); c.scale(-1, 1); }
  for (let y = 0; y < h; y++) {
    const row = matrix[y];
    for (let x = 0; x < w; x++) {
      const ch = row[x];
      if (ch === '.' || !pal[ch]) continue;
      c.fillStyle = pal[ch];
      c.fillRect(x, y, 1, 1);
    }
  }
  return cv;
}

function spriteCanvas(kind, colour, facing, frame, mirror) {
  const key = `${kind}|${colour}|${facing}|${frame}|${mirror ? 1 : 0}`;
  let cv = cache.get(key);
  if (cv) return cv;
  const set = SETS[kind] || SETS.crew;
  const matrix = (set[facing] || set.front)[frame] || set.front[0];
  cv = bake(matrix, colour, kind, mirror);
  cache.set(key, cv);
  return cv;
}

/** Which way a heading points, and whether the side view needs mirroring. */
function facingFor(dx, dy) {
  if (Math.abs(dx) > Math.abs(dy) * 1.2) {
    return { facing: 'side', mirror: dx < 0 };
  }
  return { facing: dy < 0 ? 'back' : 'front', mirror: false };
}

/**
 * Draw a sprite standing on its feet at (x, y) in pixel space.
 * `phase` advances the walk; `moving` false gives a slow idle bob.
 */
function drawSprite(ctx, kind, colour, x, y, phase, opts = {}) {
  const size = SPRITE_SIZE[kind] || SPRITE_SIZE.crew;
  const moving = opts.moving !== false && phase > 0;
  // stand, step A, stand, step B — a proper four-beat cycle from three cels
  const cycle = [0, 1, 0, 2];
  const frame = moving ? cycle[Math.floor(phase) % 4] : 0;
  const bob = moving ? 0 : (Math.sin((opts.clock || 0) * 1.6 + x) > 0.7 ? 1 : 0);

  const cv = spriteCanvas(kind, colour, opts.facing || 'front', frame, !!opts.mirror);
  const px = Math.round(x - size.w / 2);
  const py = Math.round(y - size.h) + bob;

  if (opts.glow) {
    ctx.globalAlpha = opts.glow;
    ctx.fillStyle = colour;
    ctx.beginPath();
    ctx.ellipse(Math.round(x), Math.round(y) - 1,
      Math.max(0.1, size.w * 0.85), Math.max(0.1, size.h * 0.3), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // contact shadow keeps the figure on the deck rather than floating
  ctx.globalAlpha = 0.42;
  ctx.fillStyle = '#000000';
  ctx.fillRect(px + 2, Math.round(y) - 1, size.w - 4, 1);
  ctx.globalAlpha = 0.22;
  ctx.fillRect(px + 1, Math.round(y) - 2, size.w - 2, 1);
  ctx.globalAlpha = 1;

  ctx.drawImage(cv, px, py);
}

/* ==== src/render/factory.js ==== */
/**
 * THE FACTORY — the pixel view.
 *
 * Everything is painted into a 240x360 offscreen buffer at 1:1, then
 * blitted to the visible canvas at an integer scale with smoothing off.
 * That is what makes the pixels crisp instead of soupy. Text labels are
 * drawn afterwards at display resolution so they stay readable.
 */





const ACCENT = {
  arcane: PX.arcane, cyan: PX.cyan, vital: PX.vital,
  flare: PX.flare, breach: PX.breach, gold: PX.gold, rose: PX.rose,
};
const accentOf = (name) => ACCENT[name] || PX.arcane;

/** Deterministic noise so the station looks the same every load. */
function mulberry(seed) {
  let a = seed >>> 0;
  return () => {
    a += 0x6D2B79F5;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const fill = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x | 0, y | 0, Math.max(1, w | 0), Math.max(1, h | 0)); };

class Factory {
  constructor(canvas, sim, store) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.sim = sim;
    this.store = store;

    this.buf = document.createElement('canvas');
    this.buf.width = PW;
    this.buf.height = PH;
    this.bctx = this.buf.getContext('2d');

    this.zoom = 'fit';
    this.panX = 0;
    this.panY = 0;
    this.selected = null;
    this.hover = null;
    this.t = 0;
    this.stars = Array.from({ length: 90 }, () => ({
      x: Math.random() * PW, y: Math.random() * PH,
      a: Math.random() * 0.6 + 0.15, s: Math.random() * 0.4 + 0.1,
    }));
    // The field is baked far larger than the station so it fills the
    // stage around it at any scale.
    this.bgW = 760;
    this.bgH = 640;
    this.bg = document.createElement('canvas');
    this.bg.width = this.bgW;
    this.bg.height = this.bgH;
    this.bakeBackground();
    this.floors = new Map();
    for (const r of ROOMS) this.bakeFloor(r);

    this.beacons = Array.from({ length: 22 }, (_, i) => {
      const r = mulberry(9000 + i * 37);
      const edge = r();
      return {
        x: r() * 760,
        y: r() * 640,
        c: r() < 0.3 ? PX.breach : r() < 0.6 ? PX.cyan : PX.flare,
        rate: 0.5 + r() * 1.8,
        seed: r() * 10,
      };
    });

    this.resize();
  }

  /**
   * The industrial field the station sits in. Baked once — it does not
   * animate, and redrawing a few hundred blocks every frame is waste.
   */
  bakeBackground() {
    const BW = this.bgW;
    const BH = this.bgH;
    const b = this.bg.getContext('2d');
    const rnd = mulberry(20260912);
    fill(b, 0, 0, BW, BH, PX.space);

    // where the station will sit, in field coordinates — keep it clear
    const hx = (BW - PW) / 2;
    const hy = (BH - PH) / 2;
    const clear = (x, y, w, h) =>
      x + w > hx - 10 && x < hx + PW + 10 && y + h > hy - 10 && y < hy + PH + 10;

    // distant glow pools — city light bouncing off the haze
    for (let i = 0; i < 14; i++) {
      const gx = rnd() * BW;
      const gy = rnd() * BH;
      const gr = 40 + rnd() * 90;
      const hue = rnd();
      const col = hue < 0.5 ? 'rgba(60,80,150,' : hue < 0.8 ? 'rgba(120,70,160,' : 'rgba(150,100,50,';
      const g = b.createRadialGradient(gx, gy, 0, gx, gy, gr);
      g.addColorStop(0, col + '0.10)');
      g.addColorStop(1, col + '0)');
      b.fillStyle = g;
      b.fillRect(gx - gr, gy - gr, gr * 2, gr * 2);
    }

    const layers = [
      { n: 210, col: PX.far,  lit: '#141929', win: 0.10, min: 14, max: 50, warm: 0.12 },
      { n: 170, col: PX.mid,  lit: '#1a2034', win: 0.16, min: 10, max: 36, warm: 0.18 },
      { n: 130, col: PX.near, lit: '#222940', win: 0.22, min: 8,  max: 26, warm: 0.24 },
      { n: 70,  col: '#1a2033', lit: '#2c3450', win: 0.26, min: 6, max: 18, warm: 0.3 },
    ];

    for (const L of layers) {
      for (let i = 0; i < L.n; i++) {
        const w = L.min + rnd() * (L.max - L.min);
        const h = L.min + rnd() * (L.max - L.min);
        const x = rnd() * (BW + 40) - 20;
        const y = rnd() * (BH + 40) - 20;
        if (clear(x, y, w, h)) continue;

        fill(b, x, y, w, h, L.col);
        fill(b, x, y, w, 1, L.lit);
        fill(b, x, y, 1, h, L.lit);
        fill(b, x, y + h - 1, w, 1, '#07070d');

        for (let wy = 3; wy < h - 2; wy += 4) {
          for (let wx = 2; wx < w - 2; wx += 4) {
            if (rnd() < L.win) {
              const warm = rnd();
              fill(b, x + wx, y + wy, 2, 2,
                warm < 0.55 ? '#2c4573' : warm < 0.85 ? '#35537c' : '#6a5736');
            }
          }
        }
        // masts, vents and roof clutter
        if (rnd() < 0.26) {
          const ax = x + 2 + rnd() * (w - 4);
          const ah = 10 + rnd() * 14;
          fill(b, ax, y - ah, 1, ah, L.lit);
          if (rnd() < 0.4) fill(b, ax - 1, y - ah, 3, 1, L.lit);
        }
        if (rnd() < 0.3) {
          const bx = x + 2 + rnd() * (w - 8);
          fill(b, bx, y - 3, 4 + rnd() * 4, 3, L.col);
          fill(b, bx, y - 3, 4, 1, L.lit);
        }
        if (rnd() < 0.14) fill(b, x - 3, y + h * 0.4, w + 6, 2, '#151a28');
        // a lit strip up one flank
        if (rnd() < 0.16) {
          b.globalAlpha = 0.5;
          fill(b, x + w - 2, y + 2, 1, h - 4, rnd() < 0.6 ? '#2f4a7a' : '#6a4a3a');
          b.globalAlpha = 1;
        }
      }
    }

    // pipe and gantry runs threading the field
    for (let i = 0; i < 46; i++) {
      const vert = rnd() < 0.5;
      const len = 40 + rnd() * 150;
      const x = rnd() * BW;
      const y = rnd() * BH;
      if (clear(x, y, vert ? 3 : len, vert ? len : 3)) continue;
      if (vert) {
        fill(b, x, y, 3, len, '#171b28');
        fill(b, x, y, 1, len, '#242b3d');
        for (let k = 0; k < len; k += 14) fill(b, x - 1, y + k, 5, 2, '#1d2334');
      } else {
        fill(b, x, y, len, 3, '#171b28');
        fill(b, x, y, len, 1, '#242b3d');
        for (let k = 0; k < len; k += 14) fill(b, x + k, y - 1, 2, 5, '#1d2334');
      }
    }

    // docking spars reaching toward the station
    for (const [sx, sy, dx, dy] of [
      [hx - 60, hy + 40, 1, 0], [hx + PW + 60, hy + 90, -1, 0],
      [hx - 60, hy + 220, 1, 0], [hx + PW + 60, hy + 250, -1, 0],
    ]) {
      for (let k = 0; k < 46; k++) {
        fill(b, sx + dx * k, sy + dy * k, 2, 4, '#1c2232');
        if (k % 8 === 0) fill(b, sx + dx * k, sy - 3, 2, 10, '#262e42');
      }
    }

    // spires punctuating the skyline
    for (let i = 0; i < 26; i++) {
      const x = rnd() * BW;
      const y = rnd() * BH;
      const sh = 30 + rnd() * 80;
      const sw = 3 + rnd() * 4;
      if (clear(x, y, sw, sh)) continue;
      fill(b, x, y, sw, sh, '#12161f');
      fill(b, x, y, 1, sh, '#1e2534');
      for (let k = 4; k < sh; k += 7) {
        if (rnd() < 0.4) fill(b, x + 1, y + k, sw - 2, 1, '#2c4573');
      }
      fill(b, x + sw / 2 - 1, y - 8, 1, 8, '#1e2534');
      fill(b, x + sw / 2 - 1, y - 9, 2, 2, '#7a3a3a');
    }

    for (let i = 0; i < 900; i++) {
      const x = rnd() * BW;
      const y = rnd() * BH;
      b.globalAlpha = 0.08 + rnd() * 0.28;
      fill(b, x, y, 1, 1, rnd() < 0.7 ? '#8d93b8' : '#5a6a9a');
    }
    b.globalAlpha = 1;
  }

  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = this.canvas.getBoundingClientRect();
    const w = Math.max(rect.width, 1);
    const h = Math.max(rect.height, 1);
    this.canvas.width = Math.round(w * dpr);
    this.canvas.height = Math.round(h * dpr);
    this.dpr = dpr;
    this.w = w;
    this.h = h;

    // Integer scale only — a fractional one gives uneven pixels and shimmer.
    this.fitScale = Math.max(1, Math.floor(Math.min((w - 12) / PW, (h - 12) / PH)));
    this.scale = this.zoom === 'fit' ? this.fitScale : this.zoom;
    this.clampPan();
  }

  /** Keep the station on screen: centred when it fits, inside the edges when it does not. */
  clampPan() {
    const mw = PW * this.scale;
    const mh = PH * this.scale;
    const slackX = Math.max(0, (mw - this.w) / 2);
    const slackY = Math.max(0, (mh - this.h) / 2);
    this.panX = Math.max(-slackX, Math.min(slackX, this.panX));
    this.panY = Math.max(-slackY, Math.min(slackY, this.panY));
    this.ox = Math.round((this.w - mw) / 2 + this.panX);
    this.oy = Math.round((this.h - mh) / 2 + this.panY);
  }

  setZoom(z) {
    this.zoom = z;
    if (z === 'fit') { this.panX = 0; this.panY = 0; }
    this.resize();
  }

  /** True when the map is larger than its frame and can be dragged. */
  get pannable() {
    return PW * this.scale > this.w + 1 || PH * this.scale > this.h + 1;
  }

  panBy(dx, dy) {
    this.panX += dx;
    this.panY += dy;
    this.clampPan();
  }

  /** Bring a room into view without moving the map if it is already visible. */
  focusRoom(room) {
    if (!this.pannable || !room) return;
    const [x1, y1, x2, y2] = room.rect;
    const cx = ((x1 + x2) / 2) * this.scale;
    const cy = ((y1 + y2) / 2) * this.scale;
    this.panX = (PW * this.scale) / 2 - cx;
    this.panY = (PH * this.scale) / 2 - cy;
    this.clampPan();
  }

  /** Display (CSS px, canvas-relative) -> pixel space. */
  toPixel(cx, cy) {
    return { x: (cx - this.ox) / this.scale, y: (cy - this.oy) / this.scale };
  }

  roomAt(x, y) {
    return ROOMS.find((r) => {
      const [x1, y1, x2, y2] = r.rect;
      return x >= x1 - 2 && x <= x2 + 2 && y >= y1 - 2 && y <= y2 + 2;
    }) || null;
  }

  draw(dt) {
    this.t += dt;
    const b = this.bctx;

    b.clearRect(0, 0, PW, PH);
    this.drawShell(b);
    this.drawCorridors(b);
    for (const room of ROOMS) this.drawRoom(b, room);
    this.drawCrew(b);

    // blit
    const c = this.ctx;
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    c.clearRect(0, 0, this.w, this.h);
    c.fillStyle = PX.space;
    c.fillRect(0, 0, this.w, this.h);
    c.imageSmoothingEnabled = false;

    // the field, centred on the station and overflowing the stage
    const bx = this.ox - ((this.bgW - PW) / 2) * this.scale;
    const by = this.oy - ((this.bgH - PH) / 2) * this.scale;
    c.drawImage(this.bg, bx, by, this.bgW * this.scale, this.bgH * this.scale);
    this.drawBeacons(c, bx, by);

    c.drawImage(this.buf, this.ox, this.oy, PW * this.scale, PH * this.scale);

    this.drawAtmosphere(c);
    this.drawLabels(c);
  }

  /** Vignette and scanlines — depth and CRT, at display resolution. */
  drawAtmosphere(c) {
    const g = c.createRadialGradient(
      this.w / 2, this.h / 2, Math.min(this.w, this.h) * 0.32,
      this.w / 2, this.h / 2, Math.max(this.w, this.h) * 0.78,
    );
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.62)');
    c.fillStyle = g;
    c.fillRect(0, 0, this.w, this.h);

    c.globalAlpha = 0.055;
    c.fillStyle = '#000000';
    for (let y = 0; y < this.h; y += 3) c.fillRect(0, y, this.w, 1);
    c.globalAlpha = 1;
  }

  /** The only part of the field that moves. */
  drawBeacons(c, bx, by) {
    const S = this.scale;
    for (const k of this.beacons) {
      const on = Math.sin(this.t * k.rate + k.seed) > 0.55;
      c.globalAlpha = on ? 0.85 : 0.1;
      c.fillStyle = k.c;
      c.fillRect(bx + k.x * S, by + k.y * S, S, S);
      if (on) {
        c.globalAlpha = 0.15;
        c.fillRect(bx + (k.x - 1) * S, by + (k.y - 1) * S, S * 3, S * 3);
      }
    }
    c.globalAlpha = 1;
  }

  /** The station's outer plating, with depth on every edge. */
  drawShell(b) {
    const M = 6;
    // drop shadow off the hull
    b.globalAlpha = 0.5;
    fill(b, M + 3, M + 3, PW - M * 2, PH - M * 2, '#000000');
    b.globalAlpha = 1;

    fill(b, M, M, PW - M * 2, PH - M * 2, PX.hullDark);

    // plating seams across the whole deck
    for (let y = M; y < PH - M; y += 16) fill(b, M, y, PW - M * 2, 1, '#12121c');
    for (let x = M; x < PW - M; x += 24) fill(b, x, M, 1, PH - M * 2, '#12121c');

    // outer frame: lit top, dark bottom
    fill(b, M, M, PW - M * 2, 3, PX.hullLit);
    fill(b, M, M, PW - M * 2, 1, PX.wallLip);
    fill(b, M, PH - M - 3, PW - M * 2, 3, '#07070d');
    fill(b, M, M, 3, PH - M * 2, PX.hull);
    fill(b, M, M, 1, PH - M * 2, PX.hullLit);
    fill(b, PW - M - 3, M, 3, PH - M * 2, PX.hull);

    // corner blocks and bolts
    for (const [x, y] of [[M, M], [PW - M - 10, M], [M, PH - M - 10], [PW - M - 10, PH - M - 10]]) {
      fill(b, x, y, 10, 10, PX.hull);
      fill(b, x, y, 10, 1, PX.wallTop);
      fill(b, x + 3, y + 3, 3, 3, PX.wallLip);
    }
    for (let x = M + 16; x < PW - M - 16; x += 28) {
      fill(b, x, M + 1, 2, 2, PX.wallLip);
      fill(b, x, PH - M - 3, 2, 2, '#1a1a26');
    }
  }

  drawCorridors(b) {
    for (const [x1, y1, x2, y2] of corridors()) {
      const w = x2 - x1;
      const h = y2 - y1;
      fill(b, x1, y1, w, h, PX.floor);

      // walkway grating
      for (let y = y1; y < y2; y += 5) fill(b, x1, y, w, 1, PX.grate);
      for (let x = x1 + 3; x < x2; x += 8) fill(b, x, y1, 1, h, '#161622');

      // kerbs, lit on one side
      fill(b, x1, y1, 1, h, '#2a2a3e');
      fill(b, x2 - 1, y1, 1, h, '#101018');
      fill(b, x1, y1, w, 1, '#2a2a3e');
      fill(b, x1, y2 - 1, w, 1, '#101018');
    }

    // hazard edging down each service corridor
    for (const vx of VCORR) {
      for (let y = 16; y < 446; y += 7) {
        fill(b, vx - CORR_W / 2, y, 1, 3, '#3a3320');
        fill(b, vx + CORR_W / 2 - 1, y + 3, 1, 3, '#3a3320');
      }
    }

    // flow lines, pulsing toward the hall
    for (const vx of VCORR) {
      for (let y = 18; y < 444; y += 8) {
        const p = ((this.t * 22 + y) % 120) / 120;
        b.globalAlpha = 0.2 + (1 - p) * 0.5;
        fill(b, vx - 1, y, 3, 4, PX.arcane);
      }
    }
    for (let x = VCORR[0]; x < VCORR[2]; x += 8) {
      const p = ((this.t * 22 + x) % 120) / 120;
      b.globalAlpha = 0.2 + (1 - p) * 0.45;
      fill(b, x, HALL_Y - 1, 4, 3, PX.arcane);
    }
    b.globalAlpha = 1;

    // overhead strips
    for (const vx of VCORR) {
      for (const y of [40, 110, 184, 250, 320, 400]) {
        fill(b, vx - 6, y, 12, 1, '#c8cadd');
        b.globalAlpha = 0.07;
        fill(b, vx - 13, y - 5, 26, 12, '#cfd4ff');
        b.globalAlpha = 1;
      }
    }

    // lit thresholds at every door
    for (const r of ROOMS) {

      const vx = VCORR[r.corr];
      const x = r.door[0] < vx ? r.door[0] : r.door[0] - 3;
      const col = ACCENT[r.accent] || PX.arcane;
      b.globalAlpha = 0.6 + Math.sin(this.t * 2 + r.door[1]) * 0.2;
      fill(b, x, r.door[1] - 8, 3, 16, col);
      b.globalAlpha = 0.13;
      fill(b, x - 4, r.door[1] - 10, 11, 20, col);
      b.globalAlpha = 1;
    }
  }

  drawRoom(b, room) {
    const [x1, y1, x2, y2] = room.rect;
    const w = x2 - x1;
    const h = y2 - y1;
    const accent = accentOf(room.accent);
    const sel = this.selected === room.id;
    const hov = this.hover === room.id;
    const act = this.sim.activity(room.id);

    // floor — baked tiles, blitted
    const floor = this.floors.get(room.id);
    if (floor) b.drawImage(floor, x1, y1);
    else fill(b, x1, y1, w, h, PX.floor);

    // ambient light from the room's own colour
    b.globalAlpha = 0.05 + act * 0.10 + (sel ? 0.09 : 0);
    fill(b, x1, y1, w, h, accent);
    b.globalAlpha = 1;

    // props
    b.save();
    b.beginPath();
    b.rect(x1, y1, w, h);
    b.clip();
    for (const [type, px, py, pw, ph, opt] of room.props) {
      paintProp(b, type, x1 + px, y1 + py, pw, ph, accent, this.t, opt);
    }
    b.restore();

    // walls, with a gap where the door is
    this.drawWalls(b, room, accent, sel || hov);
  }

  /** Tile a room's floor once into its own canvas. */
  bakeFloor(room) {
    const [x1, y1, x2, y2] = room.rect;
    const w = x2 - x1;
    const h = y2 - y1;
    const cv = document.createElement('canvas');
    cv.width = w;
    cv.height = h;
    const c = cv.getContext('2d');

    paintFloorTiles(c, room.tiles || 'plate', w, h, room.id.length * 7919 + x1 * 31 + y1);

    // scuffs and a drain, seeded so they never move between loads
    const rnd = mulberry(x1 * 104729 + y1 * 7919);
    for (let i = 0; i < 12; i++) {
      c.globalAlpha = 0.05 + rnd() * 0.08;
      fill(c, 3 + rnd() * (w - 8), 4 + rnd() * (h - 10),
        2 + rnd() * 8, 1 + rnd() * 2, rnd() < 0.5 ? '#000000' : '#4a4a66');
    }
    c.globalAlpha = 1;
    const dx = 6 + rnd() * (w - 16);
    const dy = h - 9;
    fill(c, dx, dy, 6, 6, '#0b0b11');
    for (let i = 1; i < 6; i += 2) fill(c, dx, dy + i, 6, 1, '#1d1d2b');
    fill(c, dx, dy, 6, 1, '#26263a');

    // the walls throw shade inward
    for (let i = 0; i < 7; i++) {
      c.globalAlpha = 0.13 - i * 0.018;
      fill(c, 0, i, w, 1, '#000000');
      fill(c, 0, h - 1 - i, w, 1, '#000000');
      fill(c, i, 0, 1, h, '#000000');
      fill(c, w - 1 - i, 0, 1, h, '#000000');
    }
    c.globalAlpha = 1;

    this.floors.set(room.id, cv);
  }

  /**
   * Walls with height: an outer shadow, a dark body, a lit top lip.
   * The doorway is cut out of all three so the opening reads as an opening.
   */
  drawWalls(b, room, accent, lit) {
    const [x1, y1, x2, y2] = room.rect;
    const [dx, dy] = room.door;
    const GAP = 18;
    const T = 3;
    const body = lit ? accent : PX.wall;
    const lip = lit ? accent : PX.wallLip;

    const inGapX = (px) => dy !== y1 && dy !== y2 ? false : px > dx - GAP / 2 && px < dx + GAP / 2;
    const inGapY = (py) => dx !== x1 && dx !== x2 ? false : py > dy - GAP / 2 && py < dy + GAP / 2;

    // cast shadow outward, so the block sits above the deck
    b.globalAlpha = 0.55;
    fill(b, x1 - T + 2, y2 + 2, x2 - x1 + T * 2, T, '#000000');
    fill(b, x2 + 2, y1 - T + 2, T, y2 - y1 + T * 2, '#000000');
    b.globalAlpha = 1;

    // top and bottom runs
    for (let px = x1 - T; px < x2 + T; px++) {
      if (!inGapX(px)) {
        fill(b, px, y1 - T, 1, T, PX.wallDark);
        fill(b, px, y1 - T, 1, 1, lip);
        fill(b, px, y1 - 1, 1, 1, body);
      }
      if (!inGapX(px)) {
        fill(b, px, y2, 1, T, PX.wallDark);
        fill(b, px, y2, 1, 1, body);
        fill(b, px, y2 + T - 1, 1, 1, lip);
      }
    }

    // left and right runs
    for (let py = y1 - T; py < y2 + T; py++) {
      if (!inGapY(py)) {
        fill(b, x1 - T, py, T, 1, PX.wallDark);
        fill(b, x1 - T, py, 1, 1, lip);
        fill(b, x1 - 1, py, 1, 1, body);
      }
      if (!inGapY(py)) {
        fill(b, x2, py, T, 1, PX.wallDark);
        fill(b, x2, py, 1, 1, body);
        fill(b, x2 + T - 1, py, 1, 1, lip);
      }
    }

    // door frame posts
    const post = (px, py, w, h) => {
      fill(b, px, py, w, h, PX.wallLip);
      b.globalAlpha = 0.8;
      fill(b, px, py, w, 1, accent);
      b.globalAlpha = 1;
    };
    if (dx === x1 || dx === x2) {
      const px = dx === x1 ? x1 - T : x2;
      post(px, dy - GAP / 2 - 2, T, 2);
      post(px, dy + GAP / 2, T, 2);
    } else {
      const py = dy === y1 ? y1 - T : y2;
      post(dx - GAP / 2 - 2, py, 2, T);
      post(dx + GAP / 2, py, 2, T);
    }

    // interior corner brackets
    for (const [cx, cy, sx, sy] of [[x1, y1, 1, 1], [x2 - 4, y1, -1, 1], [x1, y2 - 4, 1, -1], [x2 - 4, y2 - 4, -1, -1]]) {
      b.globalAlpha = 0.5;
      fill(b, cx + (sx > 0 ? 0 : 3), cy + (sy > 0 ? 0 : 3), 4, 1, PX.wallTop);
      fill(b, cx + (sx > 0 ? 0 : 3), cy + (sy > 0 ? 0 : 3), 1, 4, PX.wallTop);
      b.globalAlpha = 1;
    }

    // selection halo
    if (lit) {
      b.globalAlpha = 0.16;
      fill(b, x1 - T - 3, y1 - T - 3, x2 - x1 + T * 2 + 6, y2 - y1 + T * 2 + 6, accent);
      b.globalAlpha = 1;
    }
  }

  drawCrew(b) {
    // trails first so sprites sit on top
    for (const a of this.sim.onFloor()) {
      if (a.state !== 'transit') continue;
      for (let i = 1; i < a.wake.length; i++) {
        b.globalAlpha = (i / a.wake.length) * 0.18;
        fill(b, a.wake[i].x, a.wake[i].y - 1, 1, 1, a.colour);
      }
    }
    b.globalAlpha = 1;

    const all = this.sim.onFloor().slice().sort((p, q) => p.y - q.y);

    for (const a of all) {
      const moving = a.state === 'transit';
      const { facing, mirror } = facingFor(a.hx || 0, a.hy ?? 1);
      drawSprite(b, a.kind || 'crew', a.colour, a.x, a.y, a.step || 0, {
        facing,
        mirror,
        moving,
        clock: this.t,
        glow: a.kind === 'arcane' ? 0.22 : (moving ? 0.11 : 0.07),
      });
    }
  }

  /** Name plates, drawn crisp on top of the blitted pixels. */
  drawLabels(c) {
    const all = this.sim.onFloor();

    c.textAlign = 'center';
    c.textBaseline = 'bottom';

    for (const a of all) {
      const isArcane = a.kind === 'arcane';
      const show = isArcane || this.hover === a.deck || this.selected === a.deck
        || this.sim.selectedAgent === a.id || this.scale >= 3;
      if (!show) continue;

      const x = this.ox + a.x * this.scale;
      const y = this.oy + (a.y - (isArcane ? 20 : 16)) * this.scale;
      const size = Math.max(8, Math.min(12, this.scale * 2.6));
      c.font = `600 ${size}px 'Chakra Petch', sans-serif`;
      const label = `${isArcane ? '◆' : '•'} ${a.name}`;
      const tw = c.measureText(label).width;

      c.fillStyle = 'rgba(7, 7, 12, 0.82)';
      c.fillRect(x - tw / 2 - 5, y - size - 3, tw + 10, size + 6);
      c.fillStyle = a.colour;
      c.fillRect(x - tw / 2 - 5, y + 2, tw + 10, 1);
      c.fillStyle = isArcane ? '#ffffff' : a.colour;
      c.fillText(label, x, y + 1);
    }

    // every room wears its name, so the floor reads without hovering
    const focus = this.hover || this.selected;
    const plate = Math.max(7, Math.min(10, this.scale * 2.2));
    c.textAlign = 'left';
    c.font = `600 ${plate}px 'Chakra Petch', sans-serif`;
    c.letterSpacing = '1px';
    for (const r of ROOMS) {
      if (r.id === focus) continue;
      const [x1, y1] = r.rect;
      const x = this.ox + (x1 + 3) * this.scale;
      const y = this.oy + (y1 + 3) * this.scale + plate;
      const tw = c.measureText(r.name).width;
      c.fillStyle = 'rgba(7, 7, 12, 0.62)';
      c.fillRect(x - 2, y - plate - 1, tw + 5, plate + 4);
      c.fillStyle = accentOf(r.accent);
      c.globalAlpha = 0.72;
      c.fillText(r.name, x, y);
      c.globalAlpha = 1;
    }
    c.letterSpacing = '0px';
    c.textAlign = 'center';

    // the focused room gets the full plate
    const room = ROOMS.find((r) => r.id === focus);
    if (room) {
      const [x1, y1, x2] = room.rect;
      const x = this.ox + ((x1 + x2) / 2) * this.scale;
      const y = this.oy + (y1 - 5) * this.scale;
      const size = Math.max(9, Math.min(13, this.scale * 2.8));
      c.font = `700 ${size}px 'Chakra Petch', sans-serif`;
      c.letterSpacing = '2px';
      const tw = c.measureText(room.name).width;
      c.fillStyle = 'rgba(7, 7, 12, 0.88)';
      c.fillRect(x - tw / 2 - 7, y - size - 4, tw + 14, size + 7);
      c.fillStyle = accentOf(room.accent);
      c.fillText(room.name, x, y);
      c.letterSpacing = '0px';
    }
  }
}

/* ==== src/render/format.js ==== */
/**
 * Presentation helpers shared by every panel. Pure functions — nothing here
 * reads the store, touches the DOM or knows what a room is.
 */

const $ = (sel, root = document) => root.querySelector(sel);

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));

const money = (n, dp = 0) => `£${Number(n || 0).toLocaleString('en-GB', {
  minimumFractionDigits: dp, maximumFractionDigits: dp,
})}`;

const num = (n) => Number(n || 0).toLocaleString('en-GB');
const clockTime = (ts) => new Date(ts).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

const stamp = (d = new Date()) => `${String(d.getDate()).padStart(2, '0')} ${
  d.toLocaleString('en-GB', { month: 'short' }).toUpperCase()} · ${
  d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`;

const PLATFORM_CLASS = {
  TikTok: 'breach', Threads: 'arcane', X: 'ash',
  Instagram: 'arcane', Email: 'flare', Thread: 'arcane', Short: 'breach',
};

/** A labelled progress bar. `pct` is 0–1. */
function meter(pct, accent) {
  const w = Math.round(Math.max(0, Math.min(1, pct)) * 100);
  return `<div class="meter"><div class="meter-fill is-${accent}" style="width:${w}%"></div></div>`;
}

/* ==== src/render/screens.js ==== */
/**
 * The full-screen bodies — everything the rail opens.
 *
 * Split out of ui.js, which had grown to 1,553 lines carrying the shell, the
 * screens, the room widgets, the bridge, telemetry and every event handler.
 * These are the first link in the prototype chain: UIScreens → UIWidgets → UI,
 * so `this` is the one UI instance throughout and nothing had to change but
 * where the methods live.
 */




class UIScreens {
  /* ================= the empire ================= */

  screenEmpire() {
    const hour = new Date().getHours();
    const greet = hour < 5 ? 'STILL UP.' : hour < 12 ? 'GOOD MORNING.' : hour < 18 ? 'GOOD AFTERNOON.' : 'GOOD EVENING.';
    const open = this.store.totalOpen();
    const p1 = DECKS.reduce((n, d) => n + this.store.tasks(d.id).filter((t) => !t.done && t.p === 1).length, 0);
    const rev = this.store.monthlyRevenue();
    const run = this.store.runwayMonths();
    const drafts = this.store.postCount();
    const signals = this.signals();
    const decisions = signals.filter((x) => x.level === 'breach').length;

    return `
      <div class="empire-head">
        <span class="eyebrow">${esc(OPERATOR.name)} · ${esc(stamp())}</span>
        <h2 class="empire-greet">${greet}<br><span class="empire-sub">Here is the state of the empire.</span></h2>
      </div>

      <div class="stat-row">
        <div class="stat"><span class="stat-n mono is-arcane">${this.store.ledgerCalibrated() ? money(rev) : '—'}</span><span class="stat-l">Revenue / month</span></div>
        <div class="stat"><span class="stat-n mono is-gold">${run === null ? '—' : run.toFixed(1)}</span><span class="stat-l">Months runway</span></div>
        <div class="stat"><span class="stat-n mono is-flare">${open}</span><span class="stat-l">Open orders</span></div>
        <div class="stat"><span class="stat-n mono is-breach">${p1}</span><span class="stat-l">Priority one</span></div>
        <div class="stat"><span class="stat-n mono">${drafts}</span><span class="stat-l">Drafts waiting</span></div>
        <div class="stat"><span class="stat-n mono ${decisions ? 'is-breach' : 'is-vital'}">${decisions}</span><span class="stat-l">Need a decision</span></div>
      </div>

      <section class="block">
        <div class="block-head"><h3 class="sub-title" style="margin:0">What needs you</h3>
          <span class="chip">${signals.length}</span></div>
        ${signals.length ? signals.slice(0, 6).map((x) => `
          <button class="signal-row" type="button" ${x.room ? `data-room="${x.room}"` : ''}>
            <span class="signal-stripe is-${x.level}"></span>
            <span>
              <span class="signal-text">${esc(x.text)}</span><br>
              <span class="signal-src">${esc(x.src)}</span>
            </span>
          </button>`).join('')
          : '<p class="muted-note">Nothing is on fire. Put the hours into what compounds.</p>'}
      </section>

      <section class="block">
        <div class="block-head"><h3 class="sub-title" style="margin:0">The network</h3>
          <span class="chip">${AGENTS.length} agents · ${WINGS.length} wings</span></div>
        <div class="crew-chips">
          ${AGENTS.map((a) => `<button class="crew-chip" type="button" data-agent="${a.id}">
            <span class="dot" style="background:${a.colour}"></span>${esc(a.name)}
            <span class="chip-role">${esc(a.role)}</span></button>`).join('')}
        </div>
      </section>

      <section class="block">
        <div class="block-head"><h3 class="sub-title" style="margin:0">Put it to the Council</h3></div>
        <p class="muted-note">A real decision — a spend, a launch, a thing to kill. Every relevant agent argues its corner and the Commander returns one recommendation.</p>
        <button class="act is-primary" type="button" data-goscreen="council" style="margin-top:10px">Open the Council</button>
      </section>`;
  }

  /** Derived, not decorative — every line traces to real state. */
  signals() {
    const out = [];
    for (const d of DECKS) {
      const tasks = this.store.tasks(d.id);
      const p1 = tasks.filter((t) => !t.done && t.p === 1).length;
      if (p1 >= 3) out.push({ level: 'breach', room: d.id, src: d.name, text: `${d.name} is carrying ${p1} priority-one orders. Delegate or cut something.` });
    }
    if (!this.store.ledgerCalibrated()) {
      out.push({ level: 'breach', room: 'vault', src: 'TALLY · Treasurer', text: 'The ledger has never been calibrated. Every money answer below is blind until you enter real figures.' });
    }
    const run = this.store.runwayMonths();
    if (run !== null && run < 3) out.push({ level: 'breach', room: 'vault', src: 'TALLY · Treasurer', text: `Runway is ${run.toFixed(1)} months. Under three is a decision, not a metric.` });
    if (this.store.splitTotal() !== 100) {
      out.push({ level: 'flare', room: 'vault', src: 'WARDEN · Risk', text: `The profit split totals ${this.store.splitTotal()}%. The envelopes are lying until it is 100.` });
    }
    const drafts = this.store.postCount();
    if (drafts) out.push({ level: 'vital', room: 'beacon', src: 'HERALD · Signalman', text: `${drafts} post${drafts === 1 ? '' : 's'} drafted from the Archives and waiting on you.` });
    const unwired = TOOLS.filter((t) => t.state === 'not wired').length;
    if (unwired) out.push({ level: 'flare', src: 'FOUNDRY · Agent-wright', text: `${unwired} tools are not connected yet. Agents that need them can only reason, not act.` });
    const order = { breach: 0, flare: 1, vital: 2 };
    return out.sort((a, b) => order[a.level] - order[b.level]);
  }

  /* ================= the council ================= */

  screenCouncil() {
    const c = this.councilState || {};
    const verdictTone = { BUILD: 'vital', DELAY: 'flare', WATCH: 'cyan', KILL: 'breach' };

    return `
      ${this.head('The Council', `${COUNCIL.length} seats`)}
      <p class="muted-note">Put a real decision on the table — a spend, a launch, a hire, something to kill. Each agent answers from its own domain, then the Commander returns one recommendation with conditions.</p>

      <form class="council-form" data-council="1">
        <input type="text" id="councilQ" placeholder="Should we spend £15,000 developing…" autocomplete="off"
               value="${esc(c.question || '')}" ${c.busy ? 'disabled' : ''}>
        <button type="submit" ${c.busy ? 'disabled' : ''}>${c.busy ? 'Deliberating…' : 'Convene'}</button>
      </form>

      <div class="seat-row">
        ${COUNCIL.map((a) => {
          const pos = (c.positions || []).find((p) => p.id === a.id || p.agent === a.call || p.agent === a.name);
          const stance = pos?.stance || (c.busy ? 'thinking' : 'seated');
          return `
          <div class="seat ${pos ? 'is-live' : ''}">
            <span class="seat-dot" style="background:${a.colour};box-shadow:0 0 8px ${a.colour}"></span>
            <span class="seat-name">${esc(a.name)}</span>
            <span class="seat-role">${esc(a.role)}</span>
            <span class="seat-stance is-${stance}">${esc(stance)}</span>
            ${pos ? `<span class="seat-line">${esc(pos.line)}</span>` : ''}
          </div>`;
        }).join('')}
      </div>

      ${c.verdict ? `
        <section class="verdict is-${verdictTone[c.verdict] || 'arcane'}">
          <span class="eyebrow">Commander's recommendation</span>
          <h3 class="verdict-word">${esc(c.verdict)}</h3>
          <p class="verdict-because">${esc(c.because || '')}</p>
          ${(c.conditions || []).length ? `
            <span class="eyebrow" style="display:block;margin-top:10px">Conditions</span>
            <ul class="verdict-list">${c.conditions.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
        </section>` : ''}

      ${c.error ? `<p class="warn-note">${esc(c.error)}</p>` : ''}
      ${!this.sampler ? '<p class="muted-note" style="margin-top:12px">The Council needs the published page on claude.ai to reason.</p>' : ''}`;
  }

  /* ================= control room ================= */

  screenControl() {
    const needAppr = AGENTS.reduce((n, a) => n + CAPS.filter((c) => a.caps[c.id] === 'approval').length, 0);
    return `
      ${this.head('Control', `${needAppr} actions gated`)}
      <p class="muted-note">The grade each agent runs under, per capability. Nothing in this system executes unattended unless it says <strong>allow</strong>, and nothing spends money at all.</p>

      <section class="block" style="margin-top:14px">
        <div class="block-head"><h3 class="sub-title" style="margin:0">What actually runs today</h3>
          <span class="chip ${this.sampler ? 'is-vital' : 'is-flare'}">${this.sampler ? 'reasoning online' : 'reasoning offline'}</span></div>
        <p class="muted-note">Straight, so you always know what you are looking at. The grades above are the
          contract this network runs under as each piece is wired up — not a claim that every row is live.</p>
        <div class="tbl">
          <div class="tbl-row is-2"><span class="chip is-vital">live</span>
            <span>The Council — all nine seats deliberate on a question and return a verdict.</span>
            <span class="mono dim">claude.ai only</span></div>
          <div class="tbl-row is-2"><span class="chip is-vital">live</span>
            <span>Counsel — ask the network anything; it reads the whole floor before answering.</span>
            <span class="mono dim">claude.ai only</span></div>
          <div class="tbl-row is-2"><span class="chip is-vital">live</span>
            <span>Arcane Peptides — real orders, revenue, customers and stock pulled into THE LAB and THE MARKET.</span>
            <span class="mono dim">${this.store.feed() ? 'connected' : 'not connected'}</span></div>
          <div class="tbl-row is-2"><span class="chip is-vital">live</span>
            <span>The floor — ${CREW.length} crew and the commander walk, route and take the room you open.</span>
            <span class="mono dim">simulation</span></div>
          <div class="tbl-row is-2"><span class="chip is-flare">waiting on you</span>
            <span>Signal Forge — the daily Routine exists but has no connector attached, so it cannot read
              the Archives yet. Attach Notion in claude.ai → Routines.</span>
            <span class="mono dim">06:00 daily</span></div>
          <div class="tbl-row is-2"><span class="chip">not wired</span>
            <span>Everything else — the tools listed on each agent in the Garage describe what it is
              <em>for</em>. No agent calls a tool on its own yet.</span>
            <span class="mono dim">design</span></div>
        </div>
      </section>

      <div class="matrix-wrap">
        <table class="matrix">
          <thead>
            <tr><th class="matrix-agent">Agent</th>${CAPS.map((c) => `<th title="${esc(c.note)}">${esc(c.name)}</th>`).join('')}</tr>
          </thead>
          <tbody>
            ${AGENTS.map((a) => `
              <tr>
                <th class="matrix-agent">
                  <span class="dot" style="background:${a.colour}"></span>
                  <span>${esc(a.name)}<br><span class="matrix-role">${esc(a.role)}</span></span>
                </th>
                ${CAPS.map((c) => {
                  const g = a.caps[c.id] || 'deny';
                  return `<td><span class="grade is-${GRADE_TONE[g] || 'ash'}">${esc(g)}</span></td>`;
                }).join('')}
              </tr>`).join('')}
          </tbody>
        </table>
      </div>

      <section class="block" style="margin-top:14px">
        <div class="block-head"><h3 class="sub-title" style="margin:0">Standing rules</h3></div>
        <p class="doctrine">No agent spends money. The Treasurer may recommend; you move it.</p>
        <p class="doctrine">Nothing publishes unattended. Drafts wait in the Signal queue for you.</p>
        <p class="doctrine">Notion is read-only for the whole network, by your instruction.</p>
        <p class="doctrine">No agent gives medical advice about a compound, to you or to a member.</p>
      </section>`;
  }


  /* ================= screens ================= */

  screenBody() {
    switch (this.screen) {
      case 'empire': return this.screenEmpire();
      case 'council': return this.screenCouncil();
      case 'control': return this.screenControl();
      case 'agents': return this.screenAgents();
      case 'orders': return this.screenOrders();
      case 'ventures': return this.screenVentures();
      case 'ledger': return this.screenLedger();
      case 'goals': return this.screenGoals();
      case 'signals': return this.screenSignals();
      case 'system': return this.screenSystem();
      default: return '';
    }
  }

  head(title, note) {
    return `<div class="screen-head"><h2 class="screen-title">${esc(title)}</h2>
      ${note ? `<span class="chip">${esc(note)}</span>` : ''}</div>`;
  }

  screenAgents() {
    const sel = this.agent ? this.sim.everyone().find((a) => a.id === this.agent) : null;
    if (sel) {
      const room = ROOM_BY_ID[sel.deck];
      const home = ROOM_BY_ID[sel.home];
      return `
        ${this.head(sel.name, sel.role)}
        <button class="back-btn" type="button" data-agentback="1">← All crew</button>
        <p class="room-blurb" style="margin-top:12px">${esc(sel.brief || '')}</p>
        <div class="stat-row">
          <div class="stat"><span class="stat-n" style="color:${sel.colour};font-size:15px">${esc(room.name)}</span><span class="stat-l">${sel.state === 'transit' ? 'In transit to' : 'Working in'}</span></div>
          <div class="stat"><span class="stat-n" style="font-size:15px">${esc(home.name)}</span><span class="stat-l">Home station</span></div>
        </div>
        <h3 class="sub-title">Current order</h3>
        <p class="muted-note">${sel.order ? esc(sel.order) : 'Awaiting orders on this deck.'}</p>
        <h3 class="sub-title">Send to</h3>
        <div class="crew-chips">
          ${DECKS.map((d) => `<button class="crew-chip ${d.id === sel.deck ? 'is-here' : ''}" type="button"
             data-send="${sel.id}" data-to="${d.id}">${esc(d.name)}</button>`).join('')}
        </div>`;
    }

    // One roster. The Garage screen used to render this same list of the
    // same nineteen agents, opening this same detail view — so its call
    // signs, domains, tools and approval counts are on the card here, and
    // its tool table is underneath. The sim walkers carry their whole
    // config (makeWalker spreads it), so live position comes free.
    return `
      ${this.head('Agents', `${AGENTS.length} in the network`)}
      <p class="muted-note">Every agent, its domain, the tools it can reach and what it must ask you
        before doing. Click one to read it or send it somewhere.</p>
      <div class="card-grid" style="margin-top:14px">
        ${[this.sim.arcane, ...this.sim.agents].map((a) => {
          const room = ROOM_BY_ID[a.deck];
          const asks = CAPS.filter((cp) => a.caps[cp.id] === 'approval').length;
          const denied = CAPS.filter((cp) => a.caps[cp.id] === 'deny').length;
          return `
          <button class="agent-card ${a.kind === 'arcane' ? 'is-commander' : ''}" type="button" data-agent="${a.id}">
            <span class="agent-swatch" style="background:${a.colour};box-shadow:0 0 12px ${a.colour}"></span>
            <span class="agent-name">${a.kind === 'arcane' ? '◆ ' : ''}${esc(a.name)}</span>
            <span class="agent-call mono">${esc(a.call)}</span>
            <span class="agent-role">${esc(a.role)}</span>
            <span class="agent-where mono">${a.state === 'transit' ? '→ ' : ''}${esc(room.name)}</span>
            <span class="agent-brief">${esc(a.domain || a.brief || '')}</span>
            <span class="agent-tags">
              ${a.tools.map((t) => `<span class="tag">${esc(TOOLS.find((x) => x.id === t)?.name || t)}</span>`).join('')}
            </span>
            <span class="agent-tags">
              <span class="tag is-flare">${asks} need approval</span>
              <span class="tag is-breach">${denied} denied</span>
            </span>
          </button>`;
        }).join('')}
      </div>

      <section class="block" style="margin-top:14px">
        <div class="block-head"><h3 class="sub-title" style="margin:0">Tools</h3>
          <span class="chip">${TOOLS.filter((t) => t.state !== 'not wired').length} / ${TOOLS.length} wired</span></div>
        ${TOOLS.map((t) => `
          <div class="tbl-row is-2" style="border-top:1px solid var(--seam)">
            <span>${esc(t.name)}</span>
            <span class="muted-note">${esc(t.note)}</span>
            <span class="chip ${t.state === 'live' ? 'is-vital' : t.state === 'read-only' ? 'is-cyan' : 'is-breach'}">${esc(t.state)}</span>
          </div>`).join('')}
      </section>`;
  }

  screenOrders() {
    const groups = DECKS.map((d) => ({ deck: d, tasks: this.store.tasks(d.id) }))
      .filter((g) => g.tasks.length);
    return `
      ${this.head('Orders', `${this.store.totalOpen()} open`)}
      ${groups.map(({ deck, tasks }) => {
        const open = tasks.filter((t) => !t.done);
        return `
          <section class="block">
            <div class="block-head">
              <button class="block-title" type="button" data-room="${deck.id}">
                <span class="dot is-${deck.accent}"></span>${esc(deck.name)}
              </button>
              <span class="chip mono">${open.length} open</span>
            </div>
            <div class="orders">${[...open, ...tasks.filter((t) => t.done)].map((t) => this.orderRow(deck.id, t)).join('')}</div>
            <form class="order-add" data-add="${deck.id}">
              <input type="text" id="ord-${deck.id}" placeholder="Issue an order…" autocomplete="off">
              <button type="submit">Issue</button>
            </form>
          </section>`;
      }).join('')}`;
  }

  screenVentures() {
    return `
      ${this.head('Ventures', `${VENTURES.length} businesses`)}
      ${VENTURES.map((v) => {
        const row = this.store.state.ledger[v.id] || {};
        const titles = CATALOGUE.filter((c) => c.venture === v.id);
        return `
        <section class="block">
          <div class="block-head">
            <button class="block-title" type="button" data-room="${v.room}">
              <span class="dot is-${v.accent}"></span>${esc(v.name)}
            </button>
            <span class="chip">${esc(v.model)}</span>
          </div>
          <p class="muted-note">${esc(v.kind)}</p>
          <div class="fact-row">${v.facts.map((f) => `<span class="fact">${esc(f)}</span>`).join('')}</div>
          <div class="field-row">
            <label class="field">
              <span class="field-l">Revenue / month</span>
              <input class="field-i mono" type="text" inputmode="decimal" id="v-mrr-${v.id}"
                     data-ledger="${v.id}" data-field="mrr" value="${row.mrr || ''}" placeholder="0">
            </label>
            <label class="field">
              <span class="field-l">${esc(v.unitLabel)}</span>
              <input class="field-i mono" type="text" inputmode="numeric" id="v-u-${v.id}"
                     data-ledger="${v.id}" data-field="units" value="${row.units || ''}" placeholder="0">
            </label>
          </div>
          ${titles.length ? `<div class="fact-row">${titles.map((t) => `
            <span class="fact">${esc(t.title)}${t.price ? ` · ${money(t.price, 2)}` : ''}</span>`).join('')}</div>` : ''}
        </section>`;
      }).join('')}`;
  }

  screenLedger() {
    const rev = this.store.monthlyRevenue();
    const fixed = this.store.monthlyFixed();
    const net = this.store.monthlyNet();
    const run = this.store.runwayMonths();
    const allocs = this.store.allocations();
    const splitTotal = this.store.splitTotal();

    return `
      ${this.head('Ledger', this.store.ledgerCalibrated() ? 'live' : 'uncalibrated')}
      <div class="stat-row">
        <div class="stat"><span class="stat-n mono is-arcane">${money(rev)}</span><span class="stat-l">Revenue / month</span></div>
        <div class="stat"><span class="stat-n mono is-breach">${money(fixed)}</span><span class="stat-l">Fixed costs</span></div>
        <div class="stat"><span class="stat-n mono ${net >= 0 ? 'is-vital' : 'is-breach'}">${money(net)}</span><span class="stat-l">Net / month</span></div>
        <div class="stat"><span class="stat-n mono is-gold">${run === null ? '—' : `${run.toFixed(1)}`}</span><span class="stat-l">Months runway</span></div>
      </div>

      <section class="block">
        <div class="block-head"><h3 class="sub-title" style="margin:0">Cash on hand</h3></div>
        <label class="field">
          <span class="field-l">Bank balance, everything included</span>
          <input class="field-i mono" type="text" inputmode="decimal" id="cash"
                 data-budget="cash" value="${this.store.state.budget.cash || ''}" placeholder="0">
        </label>
      </section>

      <section class="block">
        <div class="block-head">
          <h3 class="sub-title" style="margin:0">Fixed costs</h3>
          <span class="chip mono">${money(fixed)} / mo</span>
        </div>
        ${BUDGET.fixed.map((f) => `
          <div class="cost-row">
            <button class="cost-name" type="button" data-room="${f.room}">
              <span class="dot is-${ROOM_BY_ID[f.room]?.accent || 'arcane'}"></span>${esc(f.name)}
            </button>
            <input class="field-i mono" type="text" inputmode="decimal" id="fx-${f.id}"
                   data-budget="fixed" data-id="${f.id}"
                   value="${this.store.state.budget.fixed[f.id] || ''}" placeholder="0">
          </div>`).join('')}
      </section>

      <section class="block">
        <div class="block-head">
          <h3 class="sub-title" style="margin:0">The split</h3>
          <span class="chip ${splitTotal === 100 ? '' : 'is-seed'} mono">${splitTotal}%</span>
        </div>
        <p class="muted-note">Every pound of net profit gets an envelope before it gets spent.</p>
        ${allocs.map((a) => `
          <div class="alloc">
            <div class="alloc-top">
              <span class="alloc-name">${esc(a.name)}</span>
              <span class="alloc-amt mono is-${a.accent}">${money(a.amount)}</span>
            </div>
            ${meter(a.pct / 100, a.accent)}
            <div class="alloc-foot">
              <span class="muted-note">${esc(a.note)}</span>
              <input class="pct-input mono" type="text" inputmode="numeric" id="sp-${a.id}"
                     data-budget="split" data-id="${a.id}" value="${a.pct}" aria-label="${esc(a.name)} percentage">
            </div>
          </div>`).join('')}
        ${splitTotal !== 100 ? `<p class="warn-note">The split is at ${splitTotal}%. Make it 100 or the envelopes lie.</p>` : ''}
      </section>`;
  }

  screenGoals() {
    const moneyGoals = GOALS.filter((g) => g.kind === 'money');
    const workGoals = GOALS.filter((g) => g.kind === 'work');
    const done = GOALS.filter((g) => this.store.goalPct(g) >= 1).length;
    return `
      ${this.head('Goals', `${done} / ${GOALS.length} hit`)}
      <section class="block">
        <div class="block-head"><h3 class="sub-title" style="margin:0">Money</h3></div>
        ${moneyGoals.map((g) => this.goalRow(g)).join('')}
      </section>
      <section class="block">
        <div class="block-head"><h3 class="sub-title" style="margin:0">Work</h3></div>
        ${workGoals.map((g) => this.goalRow(g)).join('')}
      </section>`;
  }

  screenSignals() {
    const drafts = this.store.drafts();
    return `
      ${this.head('Signals', `${drafts.length} draft${drafts.length === 1 ? '' : 's'}`)}
      <p class="muted-note">The Signal Forge reads a module from the Archives each morning and drafts a post from it. Notion is never written to.</p>
      ${drafts.length ? drafts.map((d) => `
        <article class="signal-card">
          <div class="signal-card-top">
            <span class="chip is-${PLATFORM_CLASS[d.platform] || 'ash'}">${esc(d.platform)}</span>
            <span class="signal-card-src">${esc(d.course || '')}</span>
          </div>
          <p class="signal-card-hook">${esc(d.hook)}</p>
          <pre class="signal-card-body">${esc(d.post)}</pre>
          ${d.angle ? `<p class="muted-note">${esc(d.angle)}</p>` : ''}
          <div class="signal-card-acts">
            <button class="act is-primary" type="button" data-copy="${d.id}">Copy</button>
            ${d.sourceUrl ? `<a class="act" href="${esc(d.sourceUrl)}" target="_blank" rel="noopener">Source</a>` : ''}
            <span class="signal-card-spacer"></span>
            <button class="act" type="button" data-posted="${d.id}">Posted</button>
            <button class="act is-quiet" type="button" data-kill="${d.id}">Kill</button>
          </div>
        </article>`).join('')
        : '<p class="muted-note">No drafts standing.</p>'}`;
  }

  screenSystem() {
    const mode = this.store.mode;
    const modeCopy = mode === 'synced'
      ? 'Synced. Orders, money and goals follow you across every device signed in here.'
      : mode === 'local'
        ? 'Local only. State is saved in this browser.'
        : 'Memory only. Storage is blocked here, so nothing survives a reload.';
    return `
      ${this.head('System', OPERATOR.system)}
      <section class="block">
        <div class="block-head"><h3 class="sub-title" style="margin:0">Storage</h3>
          <span class="chip">${mode}</span></div>
        <p class="muted-note">${esc(modeCopy)}</p>
      </section>
      <section class="block">
        <div class="block-head"><h3 class="sub-title" style="margin:0">Signal Forge</h3>
          <span class="chip">06:00 daily</span></div>
        <p class="muted-note">Reads The Arcane Archives, drafts three posts, writes them into this system. Notion is read-only — the agent never creates, edits or deletes anything there.</p>
      </section>
      ${this.bridgeBlock()}
      <section class="block">
        <div class="block-head"><h3 class="sub-title" style="margin:0">The floor</h3></div>
        <p class="muted-note">${DECKS.length} rooms, ${CREW.length} crew and one commander. Click a room to open its dashboard — ARCANE walks there and the crew drift toward wherever the attention is.</p>
        <div class="crew-chips">
          ${DECKS.map((d) => `<button class="crew-chip" type="button" data-room="${d.id}">
            <span class="dot is-${d.accent}"></span>${esc(d.name)}</button>`).join('')}
        </div>
      </section>`;
  }

}

/* ==== src/render/widgets.js ==== */
/**
 * Room widgets — the bespoke panel each room carries on top of its orders,
 * crew and goals — and the Arcane Peptides bridge that feeds two of them.
 *
 * Second link in the chain: UIScreens → UIWidgets → UI.
 */





class UIWidgets extends UIScreens {
  /* ================= room widgets ================= */

  /** The room-specific dashboard. Each room does a different job. */
  roomWidget(roomId) {
    switch (ROOM_WIDGET[roomId]) {
      case 'door': return this.wDoor(roomId);
      case 'lab': return this.wLab();
      case 'market': return this.wMarket();
      case 'library': return this.wLibrary();
      case 'cohorts': return this.wCohorts();
      case 'build': return this.wBuild();
      case 'manuscripts': return this.wManuscripts();
      case 'protocol': return this.wProtocol();
      case 'signals': return this.wSignals();
      case 'treasury': return this.wTreasury();
      case 'doctrine': return this.wDoctrine();
      default: return '';
    }
  }

  srcNote(text) { return `<p class="src-note"><span class="chip is-seed">placeholder</span> ${esc(text)}</p>`; }

  /**
   * A room whose work is done on a full screen. One door, named, rather
   * than a second copy of the tool rendered into a side panel.
   */
  wDoor(roomId) {
    const door = {
      council: {
        screen: 'council', label: 'Convene the Council',
        note: 'Nine seats deliberate on one real decision and the Commander returns a verdict. It needs the width of a full screen, so it opens as one.',
      },
      garage: {
        screen: 'agents', label: 'Open the roster',
        note: 'Where the network is read and configured — every agent, its domain, the tools it reaches and what it must ask you before doing.',
      },
      control: {
        screen: 'control', label: 'Open the permission matrix',
        note: 'Every agent graded against every capability. The grid is too wide for this panel, so it opens as a full screen.',
      },
    }[roomId];
    if (!door) return '';
    return `
      <h3 class="sub-title">The work of this room</h3>
      <p class="muted-note">${esc(door.note)}</p>
      <button class="wide-btn" type="button" data-goscreen="${door.screen}">${esc(door.label)} →</button>`;
  }

  wLab() {
    const coaChip = { published: 'is-vital', pending: 'is-flare', none: 'is-breach' };
    const rows = this.store.stock();
    const low = this.store.lowStock().length;
    const feed = this.store.feed();
    const fed = rows.filter((r) => r.src === 'peptides').length;
    return `
      <h3 class="sub-title">Stock</h3>
      ${feed
        ? `<p class="src-note"><span class="chip is-vital">live</span> ${fed} line${fed === 1 ? '' : 's'} from Arcane Peptides, pulled ${esc(clockTime(feed.fetchedAt))}. Hand counts below are yours and are left alone.</p>`
        : '<p class="muted-note">Counted here, saved on this device. Type a count, or tap −/+ as vials move. Click the COA chip to cycle none → pending → published.</p>'}
      <div class="stat-row">
        <div class="stat"><span class="stat-n mono">${rows.length}</span><span class="stat-l">Lines</span></div>
        <div class="stat"><span class="stat-n mono is-arcane">${this.store.totalVials()}</span><span class="stat-l">Vials on hand</span></div>
        <div class="stat"><span class="stat-n mono ${low ? 'is-flare' : 'dim'}">${low}</span><span class="stat-l">Running low</span></div>
      </div>
      <div class="stock-list">
        ${rows.map((r) => `
          <div class="stock-line">
            <span class="stock-name">
              <i class="vial is-${esc(r.tint)}"></i>${esc(r.code)}
              ${r.src === 'peptides' ? '<i class="live-dot" title="From Arcane Peptides"></i>' : ''}

                      aria-label="One ${esc(r.code)} out">&minus;</button>
              <input class="cell-in is-count mono ${r.vials === 0 ? 'dim' : r.vials < 12 ? 'is-flare' : ''}"

            <button class="row-x" type="button" data-stockdrop="${r.id}"

            <span class="stock-meta">

            </span>
          </div>`).join('')}
      </div>
      ${rows.length ? '' : '<p class="muted-note">No stock lines. Add the first below.</p>'}

      <h3 class="sub-title">Dispatch</h3>
      ${feed ? `
        <p class="src-note"><span class="chip is-vital">live</span> ${feed.dispatch.length} order${feed.dispatch.length === 1 ? '' : 's'} from the shop</p>
        <div class="tbl">
          ${feed.dispatch.slice(0, 12).map((r) => `
            <div class="tbl-row is-2">
              <span class="mono dim">${esc(r.ref)}</span>
              <span>${esc(r.items)}</span>
              <span class="chip ${/pend|unfulfil|await/i.test(r.stage) ? 'is-flare' : 'is-vital'}">${esc(r.stage)}</span>
            </div>`).join('') || '<div class="tbl-row is-2"><span class="mono dim">—</span><span>Nothing waiting.</span><span></span></div>'}
        </div>`
      : `
        ${this.srcNote(DISPATCH.source)}
        <p class="muted-note">${esc(DISPATCH.note)}</p>
        <div class="tbl">
          ${DISPATCH.rows.map((r) => `
            <div class="tbl-row is-2">

        <div class="stat"><span class="stat-n mono is-arcane">${money(potential, 2)}</span><span class="stat-l">Full set price</span></div>

        <div class="goal">
          <div class="goal-top">

            <span class="chip ${chip[r.stage] || ''}">${esc(r.stage)}</span>

        </div>`).join('')}`;

      <h3 class="sub-title">Daily protocol</h3>
      <p class="muted-note">${esc(PROTOCOL.source)}</p>
      <div class="tbl" style="margin-top:10px">
        ${PROTOCOL.rows.map((r) => `
          <div class="tbl-row is-2">
            <span>${esc(r.item)}</span>
            <span class="muted-note">${esc(r.unit)}</span>
            <span class="mono is-vital">${num(r.target)}</span>
          </div>`).join('')}
      </div>`;

  wSignals() {

      <h3 class="sub-title">Signal queue</h3>

        <article class="signal-card">
          <div class="signal-card-top">
            <span class="chip is-${PLATFORM_CLASS[d.platform] || 'ash'}">${esc(d.platform)}</span>
            <span class="signal-card-src">${esc(d.course || '')}</span>
          </div>
          <p class="signal-card-hook">${esc(d.hook)}</p>
          <pre class="signal-card-body">${esc(d.post)}</pre>
          <div class="signal-card-acts">
            <button class="act is-primary" type="button" data-copy="${d.id}">Copy</button>
            <span class="signal-card-spacer"></span>
            <button class="act" type="button" data-posted="${d.id}">Posted</button>
            <button class="act is-quiet" type="button" data-kill="${d.id}">Kill</button>
          </div>
        </article>`).join('')
        : '<p class="muted-note">No drafts standing. The Signal Forge writes three every morning.</p>'}`;
