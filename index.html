<title>Arcane Command Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles/leoos.css">

<div id="os">

  <header class="brand">
    <svg class="sigil" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2 L22.5 21 H1.5 Z" fill="none" stroke="#8b5cf6" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M5.8 17.4 L12 7.2 L18.2 17.4" fill="none" stroke="#a98bff" stroke-width="1.6"
            stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M8.6 17.4 L12 12 L15.4 17.4" fill="none" stroke="#eceaf5" stroke-width="1.4"
            stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <span>
      <span class="brand-name" id="brandName">THE ARCANE</span><br>
      <span class="brand-ver" id="brandVer">LEOOS v2.0</span>
    </span>
  </header>

  <div class="topbar">
    <div class="readout"><span class="readout-label">Stamp</span><span class="readout-value mono" id="roStamp">—</span></div>
    <div class="readout"><span class="readout-label">Open orders</span><span class="readout-value mono is-flare" id="roOrders">--</span></div>
    <div class="readout"><span class="readout-label">Crew</span><span class="readout-value mono is-vital" id="roCrew">--</span></div>
    <div class="readout"><span class="readout-label">Revenue / mo</span><span class="readout-value mono is-arcane" id="roRevenue">—</span></div>
    <div class="readout"><span class="readout-label">Runway</span><span class="readout-value mono is-gold" id="roRunway">—</span></div>
    <div class="readout"><span class="readout-label">Drafts</span><span class="readout-value mono" id="roDrafts">--</span></div>

    <span class="topbar-spacer"></span>

    <div class="transport" id="transport" role="group" aria-label="Simulation speed">
      <button type="button" data-speed="0" aria-pressed="false">HOLD</button>
      <button type="button" data-speed="1" aria-pressed="true">1×</button>
      <button type="button" data-speed="3" aria-pressed="false">3×</button>
    </div>
  </div>

  <nav class="rail" id="rail" aria-label="Navigation"></nav>

  <main class="stage">
    <div class="stage-body">
      <div class="stage-canvas" id="stageCanvas">
        <canvas id="hull" aria-label="Top-down view of the facility, with crew moving between rooms"></canvas>
        <div class="stage-tag">
          <span class="stage-tag-name">THE FACTORY</span>
          <span class="eyebrow">Click a room to open its dashboard</span>
        </div>
        <div class="tooltip" id="tooltip" hidden></div>
      </div>
      <div class="stage-screen" id="stageScreen" hidden></div>
      <aside class="room-overlay" id="roomOverlay" hidden></aside>
    </div>
    <div class="ticker">
      <span class="eyebrow ticker-label">Log</span>
      <span class="ticker-line" id="tickerLine">Bringing systems online…</span>
      <span class="ticker-time mono" id="tickerTime"></span>
    </div>
  </main>

  <aside class="dash" id="dash" aria-label="Telemetry"></aside>

</div>

<script type="module" src="src/app.js"></script>
